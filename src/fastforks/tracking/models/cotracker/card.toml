schema = 2
name = "CoTracker3"
summary = "CoTracker3 (Karaev et al., Meta AI 2024): tracking any point with a transformer that tracks all points jointly. A CNN encodes every frame at 384 x 512 into 128-channel features at 1/4 resolution (a 4-level pyramid); each track correlates the 7 x 7 neighbourhood of its current position with the 7 x 7 support of its query on every level (an MLP encodes the 4D correlation), and a transformer with attention over time and, through 64 virtual tracks, across tracks updates positions, visibility and confidence in 6 iterations. Offline: the whole video at once; online: sliding windows of 16 frames, 8 new frames per step."
tier = "experimental"
outputs = ["tracks", "visibility"]
uses = []  # fastforks.shared modules this family imports
limitations = [
  "Frames are resized to 384 x 512 (the training size and that of upstream's predictor), whatever their size and aspect ratio.",
  "cotracker3-offline holds the features of every frame (about 4 MB per frame in float16); cotracker3-online processes 16-frame windows and only keeps the tracks.",
  "Visibility is upstream's score, rescaled so that 0.5 is upstream's threshold: the offline predictor's visibility > 0.9, the online predictor's visibility x confidence > 0.6.",
  "One video per call; all queries of a call share the video.",
]

[upstream]
repo = "https://github.com/facebookresearch/co-tracker"
commit = "82e02e8029753ad4ef13cf06be7f4fc5facdda4d"  # net/ = cotracker/models/core/{cotracker/{cotracker3_offline,cotracker3_online,blocks}.py, cotracker/cotracker.py (EfficientUpdateFormer), embeddings.py, model_utils.py (inference parts)}; the runners follow cotracker/predictor.py

[licence]
code = "CC-BY-NC-4.0"  # LICENSE.md (Attribution-NonCommercial 4.0 International); README "License": portions MIT (Particle Video Revisited) and Apache-2.0 (TAP-Vid, LocoTrack)
weights = "CC-BY-NC-4.0"  # Hugging Face model card facebook/cotracker3: "license: cc-by-nc-4.0"
files = ["LICENSE.md"]
training_data = ["unstated"]
training_note = "Upstream paper: trained on synthetic Kubric MOVi-F sequences, then fine-tuned by pseudo-labelling about 15k real internet videos with other trackers (not released). No dataset entry here yet."
evidence = "https://github.com/facebookresearch/co-tracker/blob/82e02e8029753ad4ef13cf06be7f4fc5facdda4d/LICENSE.md (CC BY-NC 4.0); https://github.com/facebookresearch/co-tracker/blob/82e02e8029753ad4ef13cf06be7f4fc5facdda4d/README.md#license; https://huggingface.co/facebook/cotracker3/blob/bf55ea50d4390e1820a267f131cd6587240fb2c5/README.md (license: cc-by-nc-4.0)"

[io]
input = "0-1"  # the runner resizes the frames to 384 x 512 (bilinear, align_corners=True, as upstream's predictor) and scales them to [-1, 1] itself
min_size = 16

[modes.portable]
cuda_dtype = "float16"  # feature CNN, correlation and update transformer in float16; positions, visibility and confidence accumulate in float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fvm_conv"]  # correlation MLP and update-transformer GEMMs with fused bias / GELU / residual epilogues, fp16 accumulation

[[papers]]
title = "CoTracker3: Simpler and Better Point Tracking by Pseudo-Labelling Real Videos"
url = "https://arxiv.org/abs/2410.11831"
date = "2024-10-15"
venue = "arXiv"

[[variants]]
id = "cotracker3-offline"  # upstream scaled_offline.pth: the whole video in one window (time embedding of 60 frames, interpolated)
revision = 1
params = { online = false, window_len = 60 }
weights = [{ name = "scaled_offline.pth", size = 101890938, sha256 = "2670d4562ed69326dda775a26e54883925cd11b6fc9b24cb7aa9f8078bce7834", url = "https://huggingface.co/facebook/cotracker3/resolve/bf55ea50d4390e1820a267f131cd6587240fb2c5/scaled_offline.pth" }]

[[variants]]
id = "cotracker3-online"  # upstream scaled_online.pth: sliding 16-frame windows, step 8, as CoTrackerOnlinePredictor
revision = 1
params = { online = true, window_len = 16 }
weights = [{ name = "scaled_online.pth", size = 101695610, sha256 = "205d34789f19699d64b22cf93f9b697f15f28d4025240e31532e504109837218", url = "https://huggingface.co/facebook/cotracker3/resolve/bf55ea50d4390e1820a267f131cd6587240fb2c5/scaled_online.pth" }]
