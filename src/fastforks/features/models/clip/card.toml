schema = 2
name = "CLIP"
summary = "CLIP image towers (Radford et al. 2021): OpenAI, OpenCLIP (LAION-2B, DataComp-1B) and Apple DFN weights in timm's format; cls + patch tokens at any size, pooler_output = the post-LayerNorm cls token before the projection (QuickGELU for the OpenAI and DFN weights)."
tier = "stable"
outputs = ["last_hidden_state", "pooler_output", "hidden_states"]
uses = ["cuda_graphs", "libnet"]  # fastforks.shared modules this family imports (CUDA graphs, the timm network builder)
limitations = [
  "kernels replays a CUDA graph per small input shape without hidden states (up to about 1M activations: ViT-B ~460 px, ViT-L ~300 px), captured on the shape's second call, at most 4 per model; `model.release_graphs()` frees them.",
  "Small kernels calls (graph-sized, with or without `layers`) run GEMMs of at most 600 tokens on cuBLAS: faster in a graph replay (ViT-B/16 224 px: 1.26 against 1.52 ms), about 10 % slower eagerly on ViT-T / B; a replay equals the eager call bit for bit.",
  "`fp32_accumulate = true` puts every GEMM on cuBLAS with fp32 accumulation (the portable precision; slower on GeForce).",
  "fp16 error against the fp32 original is higher than for the other ViTs on L/14 DataComp (mean 2.8 % portable, 4.8 % kernels): one residual channel sits near 120, where fp16 steps are 0.06, about 10 % of the median activation. No overflow; float32 portable gives 0.3 %.",
  "DFN weights: the relative error (mean 1.3-3.9 % portable, 3.9-6.5 % kernels) is measured against a median |output| of only 0.015-0.021 (other weights: 0.5-0.6) with values up to 0.7; `fp32_accumulate = true` lowers kernels to about 1.5 %.",
]

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library; OpenAI / DFN weights use its `_quickgelu` architectures

[[upstream.official]]
repo = "https://github.com/openai/CLIP"
framework = "PyTorch"
reason = "timm re-implements the CLIP image towers and hosts the OpenAI, OpenCLIP and DFN weights in one format; the authors' packages carry the text towers and their own APIs."
variants = ["clip-b16-openai", "clip-l14-openai", "clip-l14-336-openai"]

[[upstream.official]]
repo = "https://github.com/mlfoundations/open_clip"
framework = "PyTorch"
reason = "timm re-implements the CLIP image towers and hosts the OpenAI, OpenCLIP and DFN weights in one format; the authors' packages carry the text towers and their own APIs."
variants = ["clip-b16-laion2b", "clip-l14-laion2b", "clip-h14-laion2b", "clip-l14-datacompxl", "clip-l14-dfn2b", "clip-h14-dfn5b", "clip-h14-378-dfn5b"]

[licence]
code = "Apache-2.0"  # timm
weights = "MIT"  # the original releases (openai/CLIP, the laion/CLIP-* OpenCLIP repos); the timm re-host cards say Apache-2.0; DFN variants override
files = []  # no vendored code: the architecture is timm's own module
training_data = ["unstated"]
evidence = "https://huggingface.co/timm/vit_large_patch14_clip_336.openai/blob/81e38efc4637de5023b10e75a7f9bd1c6fa6b010/README.md"

[io]
# the core resizes (never pads / crops) to multiples of the patch (16 or 14), antialiased bicubic; mean / std per variant
input = "mean_std"
interpolation = "bicubic"
mean = [0.48145466, 0.4578275, 0.40821073]
std = [0.26862954, 0.26130258, 0.27577711]
pad = { multiple = 16, mode = "none" }

[options]
fp16_accumulate = { default = false, effect = "precision" }  # true: cuBLAS fp16 accumulation in the GEMMs (portable, fp16; faster on Ampere and newer, larger error vs fp32)
fp32_accumulate = { default = false, effect = "precision" }  # true: kernels run every GEMM through cuBLAS with fp32 accumulation (the portable precision, with the CUDA graphs); slower on GeForce (half-rate fp32 accumulation), to be measured on data-centre GPUs

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]

