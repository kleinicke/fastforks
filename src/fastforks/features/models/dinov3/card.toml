schema = 2
name = "DINOv3 ViT"
summary = "DINOv3 ViT (Meta, 2025): self-supervised ViT backbones with 4 register tokens and RoPE; dense patch + cls features at any size (Hugging Face format checkpoints). Gated weights: accept the DINOv3 licence on each model's Hugging Face page, download model.safetensors yourself and put it under FASTFORKS_WEIGHTS_PATH (path and SHA-256 in the load error); fastforks does not send HF_TOKEN there."
tier = "stable"
outputs = ["last_hidden_state", "pooler_output", "hidden_states"]
uses = ["cuda_graphs", "depth_anything_v2"]  # fastforks.shared modules this family imports (fastbb flash attention / fp16-accumulate GEMMs)
limitations = [
  "kernels replays a CUDA graph per small input shape and layer set (up to 512 px, ViT-S 1024 px), captured on the shape's second call; at most 8 per model holding at most 256 MB of outputs (a full cache replaces only graphs unused for 64 calls, other new shapes run eagerly).",
  "The graphs' shared memory pool (intermediates) comes on top of that limit and stays reserved: up to about 470 MB more PyTorch cache than eager for ViT-H+ at 512 px with all layers, usually under 75 MB; `model.release_graphs()` frees it on the device.",
]
licence_notes = [
  "Code and weights use the DINOv3 License (Meta: attribution and conditions apply); read it before commercial use.",
]

[upstream]
repo = "https://github.com/huggingface/transformers"  # `DINOv3ViTModel` (models/dinov3_vit), the reference of these checkpoints
commit = "v5.19.0"  # release tag; net.py re-implements its eval maths with the checkpoint's parameter names

[licence]
code = "LicenseRef-DINOv3-License"
weights = "LicenseRef-DINOv3-License"
files = ["LICENSE.md"]
training_data = ["unstated"]
training_note = "LVD-1689M: 1.689B images curated from 17B public Instagram images by retrieval / clustering, self-supervised (no labels), per the paper; not released"
evidence = "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m/blob/114c1379950215c8b35dfcd4e90a5c251dde0d32/LICENSE.md (DINOv3 License, the same file in every model repo; gated: accept on Hugging Face to download)"

[io]
input = "imagenet"
interpolation = "bilinear"  # as the checkpoints' preprocessor_config.json; the core resizes (never pads / crops) to multiples of 16, antialiased
pad = { multiple = 16, mode = "none" }

[options]
fp16_accumulate = { default = false, effect = "precision" }  # true: cuBLAS fp16 accumulation in the GEMMs (portable, fp16; faster on Ampere and newer, patch-token error vs fp32 about 2.5x higher)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fastbb"]

[[variants]]
id = "dinov3-vits16"
revision = 1
params = { arch = "vits16" }
weights = [{ name = "dinov3-vits16-pretrain-lvd1689m/model.safetensors", size = 86406384, sha256 = "4610ad75edef83e75afdebf162d148dc628045ea6cbb83d67d4708c709c4f91d", url = "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m/resolve/114c1379950215c8b35dfcd4e90a5c251dde0d32/model.safetensors" }]

