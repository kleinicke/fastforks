schema = 2
name = "DINOv2"
summary = "DINOv2 (Oquab et al. 2023, Meta): self-supervised ViT backbones; patch + cls token features at any size; -reg = with 4 register tokens."
tier = "stable"
outputs = ["last_hidden_state", "pooler_output", "hidden_states"]
uses = ["cuda_graphs", "depth_anything_v2"]  # fastforks.shared modules this family imports (CUDA graphs, the vendored DINOv2 ViT, FastViT)

[upstream]
repo = "https://github.com/facebookresearch/dinov2"
commit = "7764ea0"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "LVD-142M: 142M images retrieved from web crawls by similarity to curated datasets (ImageNet-22k/1k train, Google Landmarks, fine-grained sets), self-supervised (no labels), per the paper; not released"
evidence = "https://github.com/facebookresearch/dinov2/blob/7764ea0/README.md (License section: code and model weights under Apache 2.0)"

[io]
input = "imagenet"
interpolation = "bicubic"  # the core resizes (never pads / crops) to multiples of 14 with antialiased bicubic
pad = { multiple = 14, mode = "none" }

[options]
fp16_accumulate = { default = false, effect = "precision" }  # true: cuBLAS fp16 accumulation in the GEMMs (portable, fp16; faster on Ampere and newer, patch-token error vs fp32 about 2.5x higher)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fastbb"]

[[variants]]
id = "dinov2-vits14"
revision = 1
params = { arch = "vits", registers = 0 }
weights = [{ name = "dinov2_vits14_pretrain.pth", size = 88283115, sha256 = "b938bf1bc15cd2ec0feacfe3a1bb553fe8ea9ca46a7e1d8d00217f29aef60cd9", url = "https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth" }]

