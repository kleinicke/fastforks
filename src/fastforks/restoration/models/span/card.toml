schema = 2
name = "SPAN"
summary = "SPAN (Wan et al., CVPRW 2024; NTIRE 2024 efficient super-resolution winner): a small bicubic super-resolution network (about 0.4 M parameters at inference) of six parameter-free attention blocks (re-parameterised 3 x 3 convs, attention = sigmoid(features) - 0.5) and a pixel-shuffle upsampler, trained for PSNR. `span-x4` and `span-x2` are the 48-channel release models."
tier = "experimental"
outputs = ["image"]

[upstream]
repo = "https://github.com/hongyuanyu/SPAN"
commit = "c77a5917759f09e66fbc7124220c5afc5ee221e5"  # basicsr/archs/span_arch.py; the call is BasicSR SRModel.test (net(lq), clamped)

[licence]
code = "Apache-2.0"  # LICENSE.txt
weights = "Apache-2.0"  # the README's checkpoint archive (Google Drive), no separate weights licence
files = ["LICENSE"]
training_data = ["div2k", "flickr2k"]
training_note = "Paper Sec. 4.1: DF2K (DIV2K + Flickr2K) HR images, bicubic-downsampled."
evidence = "https://github.com/hongyuanyu/SPAN/blob/c77a5917759f09e66fbc7124220c5afc5ee221e5/LICENSE.txt ; https://github.com/hongyuanyu/SPAN/blob/c77a5917759f09e66fbc7124220c5afc5ee221e5/README.md"

[io]
input = "0-1"  # BasicSR's lq in [0, 1]; the network subtracts the DIV2K mean and multiplies by 255 itself
pad = "none"  # any size: every conv pads itself (upstream runs the raw size)
min_size = 4

[params]
scale = 4
channels = 48

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc"]  # fp16-accumulate convolutions, channels-last

[[papers]]
title = "Swift Parameter-free Attention Network for Efficient Super-Resolution"
url = "https://arxiv.org/abs/2311.12770"
date = "2023-11-21"
venue = "CVPRW 2024"

[[variants]]
id = "span-x4"
revision = 1
weights = [{ name = "spanx4_ch48.pth", size = 18029841, sha256 = "28fef8c6c845a0169afed9f9f566679990ef4c03fef9885298655fb5e4036402", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1iYUA2TzKuxI0vzmA-UXr_nB43XgPOXUg", member = "spanx4_ch48.pth", archive = { size = 1326754357, sha256 = "675b653c5e730e149bb75864e04e4f3440fe8eb46e1c6f44d21b973fb5f747dc" } }]

[[variants]]
id = "span-x2"
revision = 1
params = { scale = 2 }
weights = [{ name = "spanx2_ch48.pth", size = 17905041, sha256 = "561fd5cf419a23d4de1231ce258180f61aee4aa8caa1aaaa783769c7301847bc", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1iYUA2TzKuxI0vzmA-UXr_nB43XgPOXUg", member = "spanx2_ch48.pth", archive = { size = 1326754357, sha256 = "675b653c5e730e149bb75864e04e4f3440fe8eb46e1c6f44d21b973fb5f747dc" } }]
