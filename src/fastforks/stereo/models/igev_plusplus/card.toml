schema = 2
name = "IGEV++"
summary = "IGEV++ (Xu et al. 2025): IGEV-Stereo with geometry encoding volumes for small, medium and large disparity ranges (48 bins each at 1/4 resolution, up to 768 px), aggregated separately and blended per pixel in the ConvGRU update, 32 iterations."
tier = "experimental"
outputs = ["disparity"]
uses = ["cnn_kernels", "cuda_graphs", "igev_blocks", "mobilenetv2"]  # fastforks.shared modules this family imports
limitations = [
  "CUDA output (float16, kernels, float32 with PyTorch's default TF32 convolutions) differs from the CPU by ~0.06 px mean / 1.2 px p99 at 720x1280, 0.005 px with full float32: rounding amplified by 32 GRU iterations. Portable and kernels reach the same ETH3D / Middlebury accuracy.",
]

[upstream]
repo = "https://github.com/gangweix/IGEV-plusplus"
commit = "099dec97989780d151700459c682df1cc2c18e88"

[licence]
code = "MIT"
weights = "assumed from code"  # original states no weights licence; the code licence is assumed
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/gangweix/IGEV-plusplus/blob/099dec97989780d151700459c682df1cc2c18e88/README.md#L23"  # README links the weights (Google Drive folder) with no licence of their own

[io]
pad = { multiple = 32, mode = "centre", fill = "replicate" }

[params]
max_disp = 768  # disparity range at full resolution; the three range volumes take 1/16, 1/8 and 1/4 of it (48 bins each)

[options]
iters = { default = 32, min = 1 }  # GRU update iterations
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay a CUDA graph for small repeated shapes (false: eager, no extra memory)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["igev", "igevpp", "cutlass_conv", "cudnn_hacc"]
mps_kernels = ["stereo_metal"]
# CUDA graphs (kernels): batch x padded H x W <= 500k replays a CUDA graph, captured on a shape's 4th call (`cudnn_hacc`
# plans first), at most 2 shapes per model (graph vs eager, interleaved: 126.4 vs 144.7 ms at KITTI 384x1248, reserved
# 1774 vs 694 MiB). Larger shapes run eagerly: the gain falls to 7.7 % at 544x960 and 2.1 % at 736x1280 for 1.1-1.8 GB
# more reserved memory. The graph pool stays reserved until `model.release_graphs()`; `options={"cuda_graphs": False}`
# turns it off.

# Upstream also publishes RT-IGEV++ weights (another architecture): not part of this family. All variants run with
# upstream's evaluation settings (max_disp 768, 32 iterations).

