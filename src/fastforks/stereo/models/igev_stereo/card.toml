schema = 2
name = "IGEV-Stereo"
summary = "IGEV-Stereo (Xu et al. 2023): iterative geometry encoding volume, a 3-D regularised group-wise correlation volume refined by ConvGRU updates, 32 iterations."
tier = "stable"
outputs = ["disparity"]
uses = ["cnn_kernels", "igev_blocks", "mobilenetv2"]  # fastforks.shared modules this family imports
limitations = [
  "The original code's dtu.ckpt (IGEV-MVS, another architecture) is not included.",
]

[upstream]
repo = "https://github.com/gangweix/IGEV"
commit = "4a3d937aab788b3ff3ed49b7b5c81340ab46a5eb"

[licence]
code = "MIT"
weights = "assumed from code"  # original states no weights licence; the code licence is assumed
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/gangweix/IGEV/blob/4a3d937aab788b3ff3ed49b7b5c81340ab46a5eb/README.md#L17"  # README links the weights (Google Drive) with no licence of their own

[io]
pad = { multiple = 32, mode = "centre", fill = "replicate" }

[params]
max_disp = 192  # cost-volume depth at full resolution

[options]
iters = { default = 32, min = 1 }  # GRU update iterations

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["igev", "cutlass_conv", "cudnn_hacc"]
mps_kernels = ["stereo_metal"]

# Upstream also publishes dtu.ckpt (IGEV-MVS, another architecture): not part of this family.

[[papers]]
title = "Iterative Geometry Encoding Volume for Stereo Matching"
url = "https://arxiv.org/abs/2303.06615"
date = "2023-03-12"
venue = "CVPR 2023"

[[variants]]
id = "igev-stereo-sceneflow"
revision = 1
weights = [{ mirror = true, name = "sceneflow.pth", size = 50808741, sha256 = "ce482e600c5c08f647b2728553bec73e212ed965be43f7ec41ac6cfd2b11916d", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=16e9NR_RfzFdYT5mPaGwpjccplCi82C2e" }]

