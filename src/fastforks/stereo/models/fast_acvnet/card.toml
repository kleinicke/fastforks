schema = 2
name = "Fast-ACVNet"
summary = "Fast-ACVNet (Xu et al. 2022): MobileNetV2 features; attention weights from a correlation volume (1/8 group-wise, propagated to 1/4; Fast-ACVNet+: 1/4) select the top-24 disparities of a concatenation volume, then a 3-D hourglass, top-2 soft-argmax and superpixel upsampling (max disparity 192)."
tier = "stable"
outputs = ["disparity"]
uses = ["cnn_kernels", "cuda_graphs", "mobilenetv2"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/gangweix/Fast-ACVNet"
commit = "61d5375e1816f124f4417cea506eeaddac1504e4"

[licence]
code = "MIT"
weights = "assumed from code"  # original states no weights licence
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/gangweix/Fast-ACVNet/blob/61d5375e1816f124f4417cea506eeaddac1504e4/LICENSE.md"  # README links the weights (Google Drive folders) with no licence of their own

[io]
input = "imagenet"
pad = { multiple = 32, mode = "top_right", fill = "zero" }  # the original code's KITTI test loader pads the normalized images on top and on the right with zeros
# Upstream evaluates the generalization variants with test_mid.py, which pads differently (top-left, black before the
# normalization, always + 32 px); the card pad modes have no "always add" option, so all variants use the KITTI loader's
# pad. Upstream used the test_mid.py pad: ETH3D EPE 0.55 vs our 0.64 for fast-acvnet-plus-generalization.

[params]
max_disp = 192  # cost-volume depth at full resolution

[options]
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay a CUDA graph for small repeated shapes (false: eager, no extra memory)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["igev", "cutlass_conv", "cudnn_hacc"]
# CUDA graphs (kernels): the kernels forward is launch-bound on small inputs; batch x H x W <= 500k (up to KITTI 375x1242)
# replays a CUDA graph, captured on a shape's 4th call (below), at most 2 shapes per model (Fast-ACVNet+ 640x480 7.8 vs
# 14.0 ms eager). The graph pool stays reserved (up to ~2x eager reserved memory) until `model.release_graphs()`;
# `options={"cuda_graphs": False}` turns it off. Larger inputs are GPU-bound and run eagerly
# New sizes (`cudnn_hacc` per-shape dispatch): a new padded size builds its fp16-accumulate cuDNN plans on its first
# call (all calls give the same output) and captures its CUDA graph on the 4th (time after 4 warm-up calls per size); a
# stream of new sizes around 640x480 costs Fast-ACVNet+ 28.6 ms per call (with the deferral below 16.9).
# Measured below with the earlier deferral, now
# `fastforks.kernels.cudnn_hacc.BUILD_AFTER = 3`: first 3 calls on torch convs, builds on the 4th (~120 ms incl. the
# call at ETH3D sizes), so a stream of new sizes pays no builds: Midd-H evaluation 38.3 vs 59.1 ms portable mean per
# pair (Fast-ACVNet+ 45.7 vs 67.9; before 139 / 152). ETH3D, where 2 padded sizes
# repeat 16 and 8 times: 18.9 vs 18.8 ms (Fast-ACVNet+ 19.8 vs 20.5; before the cheaper plan builds 25.0 / 26.0)

[[papers]]
title = "Accurate and Efficient Stereo Matching via Attention Concatenation Volume"
url = "https://arxiv.org/abs/2209.12699"
date = "2022-09-23"
venue = "TPAMI 2023"

