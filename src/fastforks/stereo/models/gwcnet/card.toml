schema = 2
name = "GwcNet"
summary = "GwcNet (Guo et al. 2019): group-wise correlation 3-D cost volume, stacked 3-D hourglasses and soft-argmin regression (max disparity 192)."
tier = "stable"
outputs = ["disparity"]
uses = ["cnn_kernels"]  # fastforks.shared modules this family imports
limitations = [
  "The original code's KITTI 2012 / 2015 fine-tuned weights are not included.",
  "The dominant 3D convolutions run in cuDNN in both modes, so kernels gains less over portable than for other stereo models. Portable is slightly slower than the original code at 994x1482 but allocates less than half the memory.",
]

[upstream]
repo = "https://github.com/xy-guo/GwcNet"
commit = "0987074f48b098c6e975a58ca5aacf233b0fb0eb"

[licence]
code = "MIT"
weights = "assumed from code"  # original states no weights licence; the code licence is assumed
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/xy-guo/GwcNet/blob/0987074f48b098c6e975a58ca5aacf233b0fb0eb/README.md#L27"  # README links the weights (Google Drive) with no licence of their own

[io]
input = "imagenet"
pad = { multiple = 32, mode = "top_right", fill = "zero" }  # the original code's test loaders pad the normalized images on top and on the right with zeros

[params]
max_disp = 192  # cost-volume depth at full resolution

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["igev", "cutlass_conv", "cudnn_hacc"]

# Upstream also links KITTI 2012 / 2015 fine-tuned weights (a second archive): not added yet. Both variants are the
# last SceneFlow epoch (checkpoint_000015) of the one upstream archive.

[[variants]]
id = "gwcnet-gc-sceneflow"
revision = 1
# GwcNet-gc: group-wise correlation + concatenation volume
weights = [{ mirror = true, name = "sceneflow/gwcnet-gc/checkpoint_000015.ckpt", size = 83149942, sha256 = "95c9647f4896af1c9a3f2bb2e9989a569dde57c31b5a1b7830379b1d3434d13a", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1qiOTocPfLaK9effrLmBadqNtBKT4QX4S", member = "sceneflow/gwcnet-gc/checkpoint_000015.ckpt", archive = { size = 297833080, sha256 = "24a44903daf43c8b1fb5dad3d18f8e16868431ad6a2dad662892158e57dad45c" } }]
params = { concat_volume = true }

[[variants]]
id = "gwcnet-g-sceneflow"
revision = 1
# GwcNet-g: group-wise correlation volume only
weights = [{ mirror = true, name = "sceneflow/gwcnet-g/checkpoint_000015.ckpt", size = 78452197, sha256 = "ea0f406dc1abd18302b956225c92be7e63722a9e0cb08b9f091a0207b9b6302b", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1qiOTocPfLaK9effrLmBadqNtBKT4QX4S", member = "sceneflow/gwcnet-g/checkpoint_000015.ckpt", archive = { size = 297833080, sha256 = "24a44903daf43c8b1fb5dad3d18f8e16868431ad6a2dad662892158e57dad45c" } }]
params = { concat_volume = false }
