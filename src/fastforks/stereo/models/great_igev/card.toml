weights = [{ mirror = true, name = "great-igev-kitti-submit.pth", size = 58426062, sha256 = "c80d31c62d9391692d646309f5b190e0ac819e53fc32f8eeccc8cf49e6e991b4", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=10XYu8RWa-HpUbiGwDp3AvyRzJvYNEbMb" }]

