schema = 2
name = "GREAT-IGEV"
summary = "GREAT-IGEV (Li et al. 2025): IGEV-Stereo with global attention (spatial, epipolar-row matching and volume attention) that builds an excitation-weighted cost volume, then IGEV's ConvGRU updates, 32 iterations."
tier = "stable"
outputs = ["disparity"]
uses = ["cnn_kernels", "cuda_graphs", "igev_blocks", "mobilenetv2"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/JarvisLee0423/GREAT-Stereo"
commit = "2a6b1efede8c3a9eec9540790c2700ea2f3dee7d"

[licence]
code = "Apache-2.0"
weights = "assumed from code"  # original states no weights licence; the code licence is assumed
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/JarvisLee0423/GREAT-Stereo/blob/2a6b1efede8c3a9eec9540790c2700ea2f3dee7d/README.md#L558"  # README links the weights (Google Drive folder) with no licence of their own

[io]
pad = { multiple = 32, mode = "centre", fill = "replicate" }

[params]
max_disp = 192  # cost-volume depth at full resolution (upstream: 768 for Middlebury, 192 for the others)

[options]
iters = { default = 32, min = 1 }  # GRU update iterations
cuda_graphs = { default = false, effect = "speed" }  # kernels: replay a CUDA graph for small repeated shapes (true: -9 % at KITTI, +1.3 GB reserved)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["igev", "igevpp", "cutlass_conv", "cudnn_hacc"]
mps_kernels = ["stereo_metal"]
# CUDA graphs (kernels, opt-in with `options={"cuda_graphs": True}`): batch x padded H x W <= 500k replays a CUDA graph,
# captured on a shape's 4th call (`cudnn_hacc` plans first), at most 2 shapes per model. Off by default: the gain is
# below 10 % for about 1.3 GB more reserved memory (graph vs eager, interleaved: 119.2 vs 131.0 ms at KITTI 384x1248,
# reserved 2032 vs 740 MiB; 4.6 % at 544x960, 0.7 % at 736x1280). The graph pool stays reserved until
# `model.release_graphs()`.

# Upstream also publishes GREAT-RAFT, GREAT-Selective, the "solid" GREAT-IGEV variants and GREAT-IGEV-DepthAny (other
# architectures): not part of this family. Variants run with upstream's evaluation settings (32 iterations, max_disp
# 768 for Middlebury, 192 for the others).

[[papers]]
title = "Global Regulation and Excitation via Attention Tuning for Stereo Matching"
url = "https://arxiv.org/abs/2509.15891"
date = "2025-09-19"
venue = "ICCV 2025"

[[variants]]
id = "great-igev-sceneflow"
revision = 1
weights = [{ mirror = true, name = "great-igev-sceneflow-submit.pth", size = 58418528, sha256 = "dd131ef44fc08c8898fa23699dc9cf05b03fdf829035b221384faf9dd7af0dde", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1G2y1ClXWlHf8YuP19E1HFNzyZ5D6T73f" }]

