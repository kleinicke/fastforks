schema = 2
name = "S2M2"
summary = "S2M2 (Min et al. 2025): multi-resolution transformer with optimal-transport matching; also outputs confidence and occlusion maps."
tier = "stable"
outputs = ["disparity", "confidence", "occlusion"]
uses = ["cuda_graphs", "mlx_wrap"]  # fastforks.shared modules this family imports
limitations = [
  "At 994x1482 portable S2M2-S is about as fast as the original code and allocates slightly more memory; use kernels for speed and memory.",
]

[upstream]
repo = "https://github.com/junhong-3dv/s2m2"
commit = "8f3bd785df593619d955203c6f2c741bef6e31df"

[licence]
code = "CC-BY-NC-4.0"
weights = "CC-BY-NC-4.0"
files = ["LICENSE.md"]
training_data = ["unstated"]
training_note = "README: extended training data incl. transparent objects"
evidence = "https://github.com/junhong-3dv/s2m2/blob/8f3bd785df593619d955203c6f2c741bef6e31df/README.md#L24"  # "solely for non-commercial research and education purposes"

[io]
pad = { multiple = 32, mode = "centre", fill = "family" }  # upstream: blurred image in the border

[params]
dim_expansion = 1
use_positivity = true
refine_iter = 3

[options]
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay a CUDA graph for small repeated shapes (false: eager, no extra memory)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]
mlx_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["s2m2", "s2m2_cutlass", "cudnn_hacc"]
# CUDA graphs (kernels): the kernels forward is launch-bound on small inputs; batch x padded H x W <= 500k (up to KITTI
# 375x1242) replays a CUDA graph, captured on a shape's 4th call (after its `cudnn_hacc` plans), at most 2 shapes per
# model (Windows S2M2-S KITTI 50-53 -> 36 ms). The graph pool stays reserved (KITTI 1.0 vs 0.4 GB eager) until
# `model.release_graphs()`; `cuda_graphs=False` turns it off. Larger inputs are GPU-bound and run eagerly (720x1280
# 74.0 vs 69.6 ms with a graph, for 1.8 vs 0.7 GB reserved)

[[papers]]
title = "S2M2: Scalable Stereo Matching Model for Reliable Depth Estimation"
url = "https://arxiv.org/abs/2507.13229"
date = "2025-07-17"
venue = "ICCV 2025"

