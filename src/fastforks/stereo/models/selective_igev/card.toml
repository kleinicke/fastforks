schema = 2
name = "Selective-IGEV"
summary = "Selective-IGEV (Wang et al. 2024, Selective-Stereo): IGEV-Stereo with selective recurrent units, attention-blended small (1x1) and large (3x3) ConvGRUs on a channel- and spatially re-weighted context, 32 iterations."
tier = "experimental"
outputs = ["disparity"]
uses = ["cnn_kernels", "igev_blocks", "mobilenetv2"]  # fastforks.shared modules this family imports
limitations = [
  "ONNX export needs torch >= 2.14 (older exporters fail on this network).",
]

[upstream]
repo = "https://github.com/Windsrain/Selective-Stereo"
commit = "c39acbfef9fbe36fbc01efa4abeafc62bbe2da36"

[licence]
code = "MIT"
weights = "assumed from code"  # original states no weights licence; the code licence is assumed
files = ["LICENSE"]
training_data = ["sceneflow"]
evidence = "https://github.com/Windsrain/Selective-Stereo/blob/c39acbfef9fbe36fbc01efa4abeafc62bbe2da36/README.md#L25"  # README links the weights (Google Drive folder) with no licence of their own

[io]
pad = { multiple = 32, mode = "centre", fill = "replicate" }

[params]
max_disp = 192  # cost-volume depth at full resolution

[options]
iters = { default = 32, min = 1 }  # GRU update iterations

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["igev", "cutlass_conv", "cudnn_hacc"]
mps_kernels = ["stereo_metal"]

# Upstream also publishes Selective-RAFT weights (another architecture): not part of this family.
# All variants run with max_disp 192 (the cost-volume depth); the upstream Middlebury demo uses 768. It stays a
# [params] entry: the kernels path has not been run at other values.

[[variants]]
id = "selective-igev-sceneflow"
revision = 1
weights = [{ mirror = true, name = "sceneflow.pth", size = 52990211, sha256 = "27286b184d68efe31c150f53229bbe72300c4e302524395f5bfbbad7a4604727", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1N0VfCFcAwSEPeXdWcrSS0JlNa4xm2gIn" }]

