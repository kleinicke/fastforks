weights = [{ mirror = true, name = "kitti12.pth", size = 52994813, sha256 = "3a9ed6f2e778bedf35887691bb7072621aa053ca114221f889b1fd772f8b6b49", url = "https://drive.usercontent.google.com/download?export=download&confirm=t&id=1FS5LapV8uP19hce5pXw0wXMf7ZTz0djf" }]

