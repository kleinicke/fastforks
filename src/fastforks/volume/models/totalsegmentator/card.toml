schema = 2
name = "TotalSegmentator"
summary = "TotalSegmentator (Wasserthal et al., Radiology: AI 2023): 117 anatomical structures (organs, bones, muscles, vessels) in CT, from nnU-Net v2 3D U-Nets. `total` merges five 1.5 mm part networks, `total-3mm` is the single fast 3 mm network. Gives one integer label volume on the input grid plus the label names."
tier = "experimental"
outputs = ["labels"]

[upstream]
repo = "https://github.com/wasserth/TotalSegmentator"
commit = "184fa4765456492b2ab81a981cc387465906b003"  # v2.18.0: totalsegmentator/{nnunet,resampling,map_to_binary}.py; the network and sliding window of nnU-Net v2.8.1 (MIC-DKFZ/nnUNet 468cf803df9b267150ae2b6c0c59b8ac84f16227, Apache-2.0) in fastforks/volume/_nnunet.py

[licence]
code = "Apache-2.0"  # LICENSE (TotalSegmentator and nnU-Net)
weights = "Apache-2.0"  # the open tasks' weights (GitHub release v2.0.0-weights); the licensed tasks are not included
files = ["LICENSE"]
training_data = ["totalsegmentator-ct"]
training_note = "1559 CT scans of the TotalSegmentator dataset v2 (CC BY 4.0). Only the weights licence counts for the commercial flag."
evidence = "https://github.com/wasserth/TotalSegmentator/blob/184fa4765456492b2ab81a981cc387465906b003/LICENSE ; https://github.com/wasserth/TotalSegmentator/blob/184fa4765456492b2ab81a981cc387465906b003/README.md"

[params]
folds = [0]
step = 0.8  # TotalSegmentator's sliding-window step
mirror = false
classes = "classes_total.txt"

[modes.portable]
cuda_dtype = "float16"  # float16 networks (nnU-Net: float16 autocast), channels-last 3D; resampling in float32 / float64
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["vol_norm"]  # portable + InstanceNorm + LeakyReLU as one in-place kernel

[[papers]]
title = "TotalSegmentator: Robust Segmentation of 104 Anatomic Structures in CT Images"
url = "https://doi.org/10.1148/ryai.230024"
date = "2023-07-05"
venue = "Radiology: Artificial Intelligence 2023"

[[papers]]
title = "nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation"
url = "https://doi.org/10.1038/s41592-020-01008-z"
date = "2020-12-07"
venue = "Nature Methods 2021"

