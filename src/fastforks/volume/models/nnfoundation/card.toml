revision = 1
params = { arch = "vit" }
weights = [{ name = "nnFoundationViT/checkpoint_final.pth", size = 2697595195, sha256 = "022ad18fc38885f6591f1e10c44e98d154019db92ca90f78f796f882013600ac", url = "https://huggingface.co/MIC-DKFZ/nnFoundationViT/resolve/c691f2115140458ec64017712eb8ebbc8dde6ae4/checkpoint_final.pth" }]
