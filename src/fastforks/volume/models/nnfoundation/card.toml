schema = 2
name = "nnFoundation"
summary = "nnFoundation (Harsy et al. 2026): DKFZ's self-supervised 3D radiology foundation encoders, pre-trained with nnssl on 2.1 M CT, MRI and PET volumes. `nnfoundation-cnn` is the ResEnc-L U-Net encoder (6 stages, 32-320 channels, strides 1-32), `nnfoundation-vit` the Primus ViT (40 layers, width 1056, 8³ patch tokens, fixed 192³ input). Gives the encoder feature maps of a z-score normalised volume for fine-tuning or frozen-feature use; the MAE decoder is not included."
tier = "experimental"
outputs = ["features"]

[upstream]
repo = "https://github.com/MIC-DKFZ/nnssl"
commit = "3d774e942256bd70e5e264c6b94fa38e25f7ed74"  # nnFoundation branch; the networks are dynamic_network_architectures 0.4.4 (ResidualEncoderUNet's encoder, Primus; Apache-2.0) with timm 1.0.22's Eva blocks (Apache-2.0), z-score normalisation of nnU-Net v2.8.1 (Apache-2.0)

[licence]
code = "Apache-2.0"  # LICENSE: the ported network code (dynamic_network_architectures, timm, nnU-Net); no nnssl code is used
weights = "CC-BY-SA-4.0"  # Hugging Face MIC-DKFZ/nnFoundationCNN and nnFoundationViT model cards: "license: cc-by-sa-4.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "2.1 million CT, MRI and PET volumes from 125 institutional and public datasets (Human Radiome Project); the dataset list is not published with the weights. Share-alike: models fine-tuned from these weights are adapted material under CC-BY-SA-4.0."
evidence = "https://huggingface.co/MIC-DKFZ/nnFoundationCNN/blob/f443c09319988e833b3d9589bf95909e4443d7b2/README.md ; https://huggingface.co/MIC-DKFZ/nnFoundationViT/blob/c691f2115140458ec64017712eb8ebbc8dde6ae4/README.md ; https://github.com/MIC-DKFZ/dynamic-network-architectures/blob/main/LICENSE"

[params]
arch = "cnn"

[modes.portable]
cuda_dtype = "float16"  # float16 networks (nnU-Net: float16 autocast), channels-last 3D for the CNN; statistics in float64
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["vol_norm"]  # CNN: portable + InstanceNorm + LeakyReLU as one in-place kernel; ViT: fp16-accumulate GEMMs

[[papers]]
title = "nnFoundation: 3D Foundation Models for Radiology"
url = "https://arxiv.org/abs/2609.26924"
date = "2026-09-22"
venue = "arXiv 2026"

[[papers]]
title = "Primus: Enforcing Attention Usage for 3D Medical Image Segmentation"
url = "https://arxiv.org/abs/2503.01835"
date = "2025-03-03"
venue = "arXiv 2025"
variants = ["nnfoundation-vit"]

[[variants]]
id = "nnfoundation-cnn"
revision = 1
params = { arch = "cnn" }
weights = [{ name = "nnFoundationCNN/checkpoint_final.pth", size = 409579442, sha256 = "ac262d3e8c226c79f9567fddc34d38e011284730ddf2294b5c6c319ce2f22bbd", url = "https://huggingface.co/MIC-DKFZ/nnFoundationCNN/resolve/f443c09319988e833b3d9589bf95909e4443d7b2/checkpoint_final.pth" }]

[[variants]]
