schema = 2
name = "PARSeq (scene text recognition)"
summary = "PARSeq (Bautista and Atienza, ECCV 2022): a ViT encoder over the word crop (32 x 128) and one two-stream Transformer decoder layer trained with permuted autoregressive sequence modelling; reads one cropped word or short line (94 characters: Latin letters, digits, ASCII punctuation; no space). Greedy autoregressive decoding plus one refinement pass, as upstream `read.py`. A recogniser only: the whole input is one line (one quad over the image); pair it with a detector (e.g. `ppocrv5-mobile` boxes) for full pages."
tier = "experimental"
outputs = ["boxes", "texts", "scores"]
uses = ["pil_resize"]

[upstream]
repo = "https://github.com/baudm/parseq"
commit = "1902db043c029a7e03a3818c616c06600af574be"  # net.py = strhub/models/parseq/{model,modules}.py + timm VisionTransformer; the call is read.py

[licence]
code = "Apache-2.0"
weights = "assumed from code"  # the release v1.0.0 assets carry no licence of their own
files = ["LICENSE", "NOTICE"]
training_data = ["unstated"]
training_note = "The README does not say which data the released checkpoints were trained on; the paper's best models use its real-data union (COCO-Text, RCTW17, Uber-Text, ArT, LSVT, MLT19, ReCTS, TextOCR, OpenVINO; Datasets.md)."
evidence = "https://github.com/baudm/parseq/blob/1902db043c029a7e03a3818c616c06600af574be/LICENSE"

[io]
input = "0-255"  # the runner resizes to 32 x 128 (antialiased bicubic, 8-bit levels as PIL) and normalises to [-1, 1]

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
status = "none"
reason = "the 26-step decoding loop is launch-bound, not kernel-bound: replaying it as a CUDA graph takes the forward from 29.8 to 3.4 ms (parseq) and 29.8 to 1.9 ms (parseq-tiny) with identical logits, but that is a graph, not a kernel (no library in the manifests helps; SDPA / cuBLAS are already the compute), so it is a portable-mode candidate, not a kernels mode (2026-11-15, results/2026-11-15_kernel_slower_remeasure.md)"

[[papers]]
title = "Scene Text Recognition with Permuted Autoregressive Sequence Models"
url = "https://arxiv.org/abs/2207.06966"
date = "2022-07-14"
venue = "ECCV 2022"

[[variants]]
id = "parseq"
revision = 1
params = { dim = 384, enc_heads = 6, dec_heads = 12 }
weights = [{ name = "parseq-bb5792a6.pt", size = 95392675, sha256 = "bb5792a68e367476abca029cbf8699abc805f3d3dc7e57aae45c8ec4f7b7cd00", url = "https://github.com/baudm/parseq/releases/download/v1.0.0/parseq-bb5792a6.pt" }]

