schema = 2
name = "PP-OCRv5 (server / mobile)"
summary = "PP-OCRv5 (PaddleOCR 3, Baidu 2025): a DB text detector (PP-HGNetV2 + LKPAN for server, PP-LCNetV3 + RSE-FPN for mobile) finds text lines of any orientation as quads; each line is cut out with a perspective warp and read by a CTC recogniser (PP-HGNetV2 / PP-LCNetV3 with an SVTR neck) over 18 383 characters (simplified and traditional Chinese, English, Japanese, pinyin). Inference as PaddleX's OCR pipeline without the document unwarping and the text-line orientation classifier. The portable `module()` is the detector with its normalisation."
tier = "experimental"
outputs = ["boxes", "texts", "scores"]
uses = []
limitations = [
  "No document orientation / unwarping and no text-line orientation classifier (upside-down lines are read as they are).",
  "The DB post-processing runs on the CPU (OpenCV-exact geometry); hole contours of the binary map are not boxed (upstream boxes them too; they rarely pass `box_threshold`).",
]

[upstream]
repo = "https://github.com/PaddlePaddle/PaddleOCR"
commit = "dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf"  # inference as PaddleX 3.3.13 `OCR` pipeline (paddlex/inference/pipelines/ocr, models/text_detection, models/text_recognition)

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # Hugging Face model cards PaddlePaddle/PP-OCRv5_*: "license: apache-2.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "The PP-OCRv5 technical report describes public and synthetic text data plus Baidu's own data; the exact sets are not listed."
evidence = "https://github.com/PaddlePaddle/PaddleOCR/blob/dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf/LICENSE ; https://huggingface.co/PaddlePaddle/PP-OCRv5_server_det"

[io]
input = "0-255"  # the runner flips RGB to BGR (upstream reads with OpenCV), resizes (OpenCV linear) and normalises itself

[options]
box_threshold = { default = 0.6, min = 0.0, max = 1.0, aliases = ["text_det_box_thresh"] }  # minimum mean detector score inside a box
unclip_ratio = { default = 1.5, min = 0.1, aliases = ["text_det_unclip_ratio"] }  # box growth: offset = area * ratio / perimeter

[params]
server = true

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
status = "none"
reason = "cuDNN convolutions are the networks; the time outside them is the per-line crop / resize and the CPU box geometry"

[[papers]]
title = "PaddleOCR 3.0 Technical Report"
url = "https://arxiv.org/abs/2507.05595"
date = "2025-07-08"
venue = "arXiv"

[[papers]]
title = "Real-time Scene Text Detection with Differentiable Binarization"
url = "https://arxiv.org/abs/1911.08947"
date = "2019-11-20"
venue = "AAAI 2020"

