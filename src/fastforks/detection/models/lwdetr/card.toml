schema = 2
name = "LW-DETR (ViT, tiny / small / medium / large / xlarge)"
summary = "LW-DETR (Chen et al. 2024, Baidu): real-time end-to-end detection with a plain ViT encoder (interleaved window and global attention), a C2f projector and a 3-layer deformable DETR decoder over the encoder's best proposals (no NMS); boxes, scores and COCO classes at the input size. Images are resized to 640x640 (aspect ratio ignored). The portable `module()` is the whole network at its input size (class logits and normalised boxes)."
tier = "experimental"
outputs = ["boxes", "scores", "labels"]
uses = ["seginfer", "cuda_graphs"]  # fastforks.shared modules this family imports
limitations = [
  "Requires the optional transformers library (the network is its `LwDetrForObjectDetection`).",
  "The original in the benchmarks and goldens is the Hugging Face transformers 5.19.0 port (AnnaZhang/lwdetr_*_60e_coco weights) of the official LW-DETR (Apache-2.0); the official repository code itself was not run.",
]

[upstream]
repo = "https://github.com/huggingface/transformers"
commit = "c4c4605f961877852b89b97478536bb3a26b6fd1"  # transformers v5.19.0: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/Atten4Vis/LW-DETR"
framework = "PyTorch"
reason = "fastforks follows the Hugging Face transformers port, which loads the AnnaZhang/lwdetr_*_60e_coco weights, instead of the authors' repository."

[licence]
code = "Apache-2.0"  # transformers; the original Atten4Vis/LW-DETR is Apache-2.0 too
weights = "Apache-2.0"  # the AnnaZhang/lwdetr_*_60e_coco model cards: license apache-2.0
files = []  # no vendored code: the architecture is transformers' own module
training_data = ["coco", "objects365"]
training_note = "COCO 2017 train after detection pretraining on Objects365; the ViT encoders start from CAEv2 self-supervised pretraining (paper arXiv:2406.03459 section 4)."
evidence = "https://huggingface.co/AnnaZhang/lwdetr_tiny_60e_coco/blob/4b636b514dcf623f6eafc9e1ab63b8ad5c513925/README.md"

[io]
input = "0-1"  # the runner resizes to 640x640 and normalises itself (the transformers processor)

[options]
score_threshold = { default = 0.05, min = 0.0, max = 1.0 }  # as D-FINE / DETR (kept if at or above); the authors' COCO evaluation keeps all of `num_select`
max_detections = { default = 100, min = 1 }  # COCO evaluation keeps the best 100 per image
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay the network from a CUDA graph (false: eager, no graph pool)

[params]
arch = "LwDetrForObjectDetection"
size = 640
num_select = 300  # the authors' PostProcess: the best (query, class) pairs before the threshold

[modes.portable]
cuda_dtype = "float16"  # the whole network; PostProcess float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc"]  # fp16-accumulate convs (patch embedding, projector), fp16-accumulate GEMMs, one CUDA graph per input shape

[output]
label_set = "coco-80"

[[papers]]
title = "LW-DETR: A Transformer Replacement to YOLO for Real-Time Detection"
url = "https://arxiv.org/abs/2406.03459"
date = "2024-06-05"
venue = "arXiv"

