schema = 2
name = "RT-DETRv2 (ResNet-vd, S / M / M* / L / X)"
summary = "RT-DETRv2 (Lv et al. 2024, Baidu): real-time end-to-end detection; ResNet-vd backbone, hybrid encoder (one attention layer, CSP-RepVGG feature pyramid), deformable-attention decoder over 300 selected queries, no NMS; boxes, scores and COCO classes at the input size. The portable `module()` is the whole network at 640x640 (class logits and normalised boxes)."
tier = "stable"
outputs = ["boxes", "scores", "labels"]
uses = ["cuda_graphs"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/lyuwenyu/RT-DETR"
commit = "df2a96c8c3a098567a1149bf0248da6efe6d495d"

[licence]
code = "Apache-2.0"
weights = "assumed from code"  # the README states only the code licence (Apache-2.0 badge); no separate weights licence
files = ["LICENSE"]
training_data = ["coco", "imagenet-1k"]
training_note = "COCO 2017 train (72 to 84 epochs); the ResNet-vd backbones start from ImageNet-1k (PaddleClas) pretraining"
evidence = "https://github.com/lyuwenyu/RT-DETR/blob/df2a96c8c3a098567a1149bf0248da6efe6d495d/LICENSE"

[io]
input = "0-1"  # the runner resizes to 640x640 (PIL bilinear) itself; no mean / std

[params]
size = 640
num_queries = 300
num_classes = 80
bottleneck = true
enc_dim = 256
enc_ffn = 1024
expansion = 1.0
dec_layers = 6
eval_layers = 6

[options]
score_threshold = { default = 0.05, min = 0.0, max = 1.0 }  # as DETR / R-CNN; the official postprocessor returns all 300 (0.0 / 300)
max_detections = { default = 100, min = 1 }  # COCO evaluation keeps the best 100 per image
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay the network from a CUDA graph (false: eager, no graph pool)

[modes.portable]
cuda_dtype = "float16"  # backbone, encoder and decoder layers; query selection, box refinement and heads stay float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc"]  # fp16-accumulating convolutions (+ cuDNN fused conv-ReLU / conv-add-ReLU), fp16-accumulate GEMMs, CUDA graph

[output]
label_set = "coco-80"

[[papers]]
title = "RT-DETRv2: Improved Baseline with Bag-of-Freebies for Real-Time Detection Transformer"
url = "https://arxiv.org/abs/2407.17140"
date = "2024-07-24"
venue = "arXiv"

