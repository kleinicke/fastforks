    { name = "gdino-base.model.safetensors", size = 933400872, sha256 = "5548f844c928c4b6f411fa8cbcc2bfa8dbbba437cb1d513975519f93c2a9ed21", url = "https://huggingface.co/IDEA-Research/grounding-dino-base/resolve/12bdfa3120f3e7ec7b434d90674b3396eccf88eb/model.safetensors" },
    { name = "bert-uncased.vocab.txt", size = 231508, sha256 = "07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3", url = "https://huggingface.co/IDEA-Research/grounding-dino-base/resolve/12bdfa3120f3e7ec7b434d90674b3396eccf88eb/vocab.txt" },
]
