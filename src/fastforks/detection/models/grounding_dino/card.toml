schema = 2
name = "Grounding DINO (open-vocabulary, Swin-T and Swin-B)"
summary = "Grounding DINO (Liu et al. 2023, IDEA Research): open-set detection that fuses a Swin image backbone with a BERT text encoder in a DINO-style deformable transformer; each of 900 queries scores every caption token. Pass `text=[...]` at call time (default: the 80 COCO class names), joined into one caption; a class score is the mean token score of its name. Images are resized to 800 px on the short side (at most 1333 on the long side). The portable `module()` is the image side with the COCO caption's text features as constants."
tier = "experimental"
outputs = ["boxes", "scores", "labels"]
uses = ["seginfer", "bert_tokenizer"]  # fastforks.shared modules this family imports
limitations = [
  "Requires the optional transformers library (the network is its `GroundingDinoForObjectDetection`).",
  "The original in the benchmarks and goldens is the Hugging Face transformers 5.19.0 port with the authors' weights (IDEA-Research/grounding-dino-*); the official GroundingDINO code (its CUDA deformable-attention op) was not run.",
  "Class names are joined into one caption of at most 256 tokens (about 100 short names); a longer list raises an error instead of being split into several passes.",
  "No phrase output: `labels` index into the given names (the token-level text threshold of the Hugging Face post-processing is not used).",
  "grounding-dino-base was trained with COCO (and RefCOCO, ODinW) data: its COCO numbers are not zero-shot.",
]

[upstream]
repo = "https://github.com/huggingface/transformers"
commit = "c4c4605f961877852b89b97478536bb3a26b6fd1"  # transformers v5.19.0: the network is built by the installed library

[licence]
code = "Apache-2.0"  # transformers; the original IDEA-Research/GroundingDINO is Apache-2.0 too
weights = "Apache-2.0"  # the IDEA-Research/grounding-dino-* model cards: license apache-2.0
files = []  # no vendored code: the architecture is transformers' own module
training_data = ["objects365"]
training_note = "Grounding DINO-T: Objects365, GoldG (Flickr30k Entities + GQA / Visual Genome images) and Cap4M (web image-caption pairs with pseudo-boxes); GoldG and Cap4M have no dataset id here (paper arXiv:2303.05499 table 2; the authors' model table)."
evidence = "https://huggingface.co/IDEA-Research/grounding-dino-tiny/blob/a2bb814dd30d776dcf7e30523b00659f4f141c71/README.md"

[io]
input = "0-1"  # the runner resizes and normalises itself (the transformers processor)

[options]
score_threshold = { default = 0.25, min = 0.0, max = 1.0 }  # the transformers post-processing default threshold (kept if above, strictly)
max_detections = { default = 100, min = 1 }  # the best (query, class) pairs kept per image (the authors' COCO evaluation: 300)

[params]
arch = "GroundingDinoForObjectDetection"

[modes.portable]
cuda_dtype = "float16"  # backbone, encoder and decoder; the text tower (once per query list) and the last heads stay float32
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not built yet: fp16-accumulate GEMMs gain nothing (tiny 112.5 vs 112.5 ms, base 127.6 vs 131.3 ms at 480x640); the time is in the deformable attention (grid_sample) and many small ops, which needs a multi-scale deformable attention kernel and per-size CUDA graphs"

[output]
label_set = "coco-80"  # the default queries; `text=` replaces them per call

[[variants]]
id = "grounding-dino-tiny"
revision = 1
weights = [
    { name = "gdino-tiny.config.json", size = 1644, sha256 = "eec82c5ab66e16df12a9a212e68ac011779927c2536cf9078658e35d85f0c67a", url = "https://huggingface.co/IDEA-Research/grounding-dino-tiny/resolve/a2bb814dd30d776dcf7e30523b00659f4f141c71/config.json" },
    { name = "gdino-tiny.model.safetensors", size = 689359096, sha256 = "1a2412ef99bd74bcd3c2a246fa1e48581f8889a1300c9051974741314fc042f3", url = "https://huggingface.co/IDEA-Research/grounding-dino-tiny/resolve/a2bb814dd30d776dcf7e30523b00659f4f141c71/model.safetensors" },
    { name = "bert-uncased.vocab.txt", size = 231508, sha256 = "07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3", url = "https://huggingface.co/IDEA-Research/grounding-dino-tiny/resolve/a2bb814dd30d776dcf7e30523b00659f4f141c71/vocab.txt" },
]

