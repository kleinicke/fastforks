schema = 2
name = "OWLv2 (open-vocabulary, CLIP B/16 and L/14)"
summary = "OWLv2 (Minderer et al. 2023, Google): open-vocabulary detection by self-training OWL-ViT on web image-text data; a CLIP ViT image tower predicts one box per patch and scores it against CLIP text embeddings of free-text class names. Pass `text=[...]` at call time (default: the 80 COCO class names); the image is padded to a square and resized to 960 (B/16) or 1008 (L/14) px. The portable `module()` is the image tower and heads with the COCO names as constant queries."
tier = "experimental"
outputs = ["boxes", "scores", "labels"]
uses = ["seginfer", "cuda_graphs", "clip_tokenizer"]  # fastforks.shared modules this family imports
limitations = [
  "Requires the optional transformers library (the network is its `Owlv2ForObjectDetection`).",
  "The original in the benchmarks and goldens is the Hugging Face transformers 5.19.0 port with the authors' weights (google/owlv2-*-ensemble); the official scenic (JAX) code was not run.",
  "Text queries are used as given (no prompt templates or prompt ensembling as in the paper's COCO / LVIS numbers); each is cut to 16 tokens as the transformers processor does.",
  "No objectness scores and no image-guided (one-shot) detection.",
  "One box per patch token (3600 for B/16, 5184 for L/14) without NMS, as the original post-processing; overlapping boxes of the same object are common at low thresholds.",
]

[upstream]
repo = "https://github.com/huggingface/transformers"
commit = "c4c4605f961877852b89b97478536bb3a26b6fd1"  # transformers v5.19.0: the network is built by the installed library

[licence]
code = "Apache-2.0"  # transformers; the original google-research/scenic is Apache-2.0 too
weights = "Apache-2.0"  # the google/owlv2-*-ensemble model cards: license apache-2.0
files = []  # no vendored code: the architecture is transformers' own module
training_data = ["webli", "objects365"]
training_note = "Self-training on WebLI image-text pairs with pseudo-boxes from an OWL-ViT annotator (itself trained on Objects365 and Visual Genome), then the weight ensemble of that model and its fine-tune on Objects365 + Visual Genome; Visual Genome has no dataset id here (OWLv2 paper, arXiv:2306.09683; the ensemble checkpoints)."
evidence = "https://huggingface.co/google/owlv2-base-patch16-ensemble/blob/cfd3195ba4ea9592eec887ded089f4c08eff231d/README.md"

[io]
input = "0-1"  # the runner pads to a square, blurs, resizes and normalises itself (the transformers processor)

[options]
score_threshold = { default = 0.1, min = 0.0, max = 1.0 }  # the transformers post-processing default (kept if above, strictly)
max_detections = { default = 100, min = 1 }  # the best boxes kept per image (the original keeps every box above the threshold)
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay the image tower and heads from a CUDA graph (false: eager, no graph pool)

[params]
arch = "Owlv2ForObjectDetection"

[modes.portable]
cuda_dtype = "float16"  # patch embedding and encoder layers; final norms, heads and text matching stay float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fvm_conv"]  # encoder GEMMs with fused bias / SiLU (folded QuickGELU) / residual epilogues, fp16 accumulation, CUDA graph

[output]
label_set = "coco-80"  # the default queries; `text=` replaces them per call

