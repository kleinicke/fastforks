schema = 2
name = "RTMDet (CSPNeXt, tiny / S / M / L / X; nano and M person detectors)"
summary = "RTMDet (Lyu et al. 2022, OpenMMLab): real-time one-stage detector, all convolutions: a CSPNeXt backbone (5 x 5 depthwise convs), a CSPNeXt-PAFPN neck and a head that predicts, per cell of the stride 8 / 16 / 32 maps, a score per class and the distances to the four box edges; class-wise NMS. COCO checkpoints (80 classes) from mmdetection and the person-only detectors mmpose ships as the box source of RTMPose (same backbone family as `fastforks.pose`'s RTMPose). The image is fitted into 640 x 640 (nano: 320 x 320); vendored from mmdetection (no mmdet / mmcv dependency). The portable `module()` is the whole network (class logits and decoded boxes per cell, before NMS)."
tier = "stable"
outputs = ["boxes", "scores", "labels"]
uses = ["cspnext", "cuda_graphs"]  # fastforks.shared modules this family imports
limitations = [
  "The image is resized like OpenCV 4's 8-bit INTER_LINEAR (what mmdetection calls); OpenCV 5 resizes differently by up to two grey levels, so a reference run on OpenCV 5 differs slightly.",
  "Boxes are not clamped to the image, as upstream: at the right or bottom border they can reach a few pixels into the padding.",
  "The person detectors' released config names COCO only; the training config stored in the checkpoints (and the file name) also lists Objects365.",
]

[upstream]
repo = "https://github.com/open-mmlab/mmdetection"
commit = "44ebd17b145c2372c4b700bfb9cb20dbd28ab64a"  # v3.3.0; the person detectors' configs: mmpose v1.3.2 (5408bc76), projects/rtmpose/rtmdet/person

[licence]
code = "Apache-2.0"  # open-mmlab/mmdetection LICENSE
weights = "Apache-2.0"  # the model zoo checkpoints are released with the repository (README: Apache 2.0)
files = ["LICENSE"]
training_data = ["coco", "imagenet-1k"]
training_note = "COCO 2017 train (300 epochs); the CSPNeXt backbones start from ImageNet-1k pretraining (configs/rtmdet/README.md)"
evidence = "https://github.com/open-mmlab/mmdetection/blob/44ebd17b145c2372c4b700bfb9cb20dbd28ab64a/configs/rtmdet/README.md"

[io]
input = "imagenet"  # the runner fits the image into size x size (OpenCV-style bilinear), pads with 114 and normalises (0..255 mmdet means)

[params]
size = 640
num_classes = 80
deepen = 1.0
widen = 1.0
neck_blocks = 3
exp_on_reg = true
depthwise = false
nms_pre = 30000  # reference test_cfg (candidates per level before NMS)
nms_iou = 0.65  # reference test_cfg

[options]
score_threshold = { default = 0.05, min = 0.0, max = 1.0 }  # as the other detection families; the reference's COCO test_cfg is 0.001
max_detections = { default = 100, min = 1 }  # COCO evaluation keeps the best 100 per image; the reference's test_cfg returns 300
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay normalisation, network and box decoding from a CUDA graph (false: eager, no graph pool)

[modes.portable]
# fp16 moves single low-score boxes by pixels (golden image: worst box 1.6 px portable, 10.7 px kernels on S, 6.4 px on
# tiny; M, X and nano-person stay below 0.5 px): the network amplifies rounding there. CUDA float32 without TF32 is
# within 0.002 px of the CPU golden, cuDNN's default TF32 convolutions are already 3.1 px off on S. COCO box AP is
# unchanged (docs/data/detection_eval.jsonl).
cuda_dtype = "float16"  # the network; scores, boxes and NMS stay float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
# Not built, for datacenter GPUs (A100 / L40S / H100 class): the net is convolutions only, so batching is where the
# headroom is (one graph per batch size; decoding and NMS are per image already); TF32 buys nothing over fp16 here and
# bf16 has no fused conv kernels; larger graphs are done (the whole network plus decoding is one graph); FP8 / INT8
# needs calibration and moves box AP, so it belongs to a TensorRT export, not to this mode.
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]  # the whole network through fastforks._optimize (fused conv + SiLU, residual, concat); one CUDA graph

[output]
label_set = "coco-80"

[[papers]]
title = "RTMDet: An Empirical Study of Designing Real-Time Object Detectors"
url = "https://arxiv.org/abs/2212.07784"
date = "2022-12-14"
venue = "arXiv"

