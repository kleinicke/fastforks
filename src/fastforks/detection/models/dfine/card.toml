schema = 2
name = "D-FINE (HGNetV2, N / S / M / L / X)"
summary = "D-FINE (Peng et al. 2025, USTC): real-time end-to-end detection like RT-DETR (HGNetV2 backbone, hybrid encoder, deformable-attention decoder over 300 selected queries, no NMS) whose decoder layers refine every box edge as a distribution over distances (fine-grained distribution refinement); boxes, scores and COCO classes at the input size. The portable `module()` is the whole network at 640x640 (class logits and normalised boxes)."
tier = "stable"
outputs = ["boxes", "scores", "labels"]
uses = ["cuda_graphs"]  # fastforks.shared modules this family imports
limitations = [
  "The original in the benchmarks and goldens is the Hugging Face transformers 5.19.0 port (DFineForObjectDetection, ustc-community weights) of the official D-FINE (Apache-2.0); the official repository code itself was not run.",
]

[upstream]
repo = "https://github.com/Peterande/D-FINE"
commit = "956d1709314c2c6a4df6f34de232054578a7449f"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # the Hugging Face conversions (ustc-community) state apache-2.0
files = ["LICENSE"]
training_data = ["coco", "imagenet-1k"]
training_note = "COCO 2017 train; the HGNetV2 backbones start from ImageNet-1k pretraining"
evidence = "https://github.com/Peterande/D-FINE/blob/956d1709314c2c6a4df6f34de232054578a7449f/LICENSE"

[io]
input = "0-1"  # the runner resizes to 640x640 (PIL bilinear) itself; no mean / std

[params]
size = 640
num_queries = 300
num_classes = 80
reg_scale = 4.0
levels = 3
lab = false
enc_dim = 256
dec_dim = 256
enc_ffn = 1024
dec_ffn = 1024
expansion = 1.0
points = [3, 6, 3]

[options]
score_threshold = { default = 0.05, min = 0.0, max = 1.0 }  # as DETR / R-CNN; the official postprocessor returns all 300 (0.0 / 300)
max_detections = { default = 100, min = 1 }  # COCO evaluation keeps the best 100 per image
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay the network from a CUDA graph (false: eager, no graph pool)

[modes.portable]
cuda_dtype = "float16"  # backbone, encoder and decoder layers; query selection, box refinement and heads stay float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc"]  # fp16-accumulating convolutions (+ cuDNN fused conv-ReLU), fp16-accumulate GEMMs, CUDA graph

[output]
label_set = "coco-80"

