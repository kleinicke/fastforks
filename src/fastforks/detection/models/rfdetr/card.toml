schema = 2
name = "RF-DETR (N / S / M / L detection, Seg N to 2XL)"
summary = "RF-DETR (Roboflow 2025): real-time end-to-end detection with a DINOv2-small backbone using windowed attention, a single-scale projector and a deformable-attention decoder over 100 to 300 queries, no NMS; boxes, scores and COCO classes at the input size, plus instance masks for the Seg variants. The image is resized to a square (384 to 768 px per variant). The portable `module()` is the whole network (normalised boxes, class logits and, for Seg, mask logits)."
tier = "experimental"
uses = ["rfdetr", "cuda_graphs"]
outputs = ["boxes", "scores", "labels", "masks"]
limitations = [
  "Requires the optional transformers and torchvision libraries.",
  "Only the Apache-2.0 checkpoints are included; the PML-1.0 detection variants (A / F / P / XL / 2XL) are not.",
  "torch.compile uses upstream positional-interpolation graph breaks; fullgraph=True is unsupported.",
]

[upstream]
repo = "https://github.com/roboflow/rf-detr"
commit = "5b22dfc0940697ce1abdfa681a5f7392b3eddbfb"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # README "License": N / S / M / L detection and every Seg checkpoint are Apache-designated
files = ["LICENSE"]
training_data = ["coco", "objects365", "lvd-142m"]
training_note = "COCO 2017 train (README); the RF-DETR paper (arXiv:2511.09554) pretrains detection on Objects365; the DINOv2-small backbone originates from LVD-142M pretraining. Full intermediate training provenance is not stated."
evidence = "https://github.com/roboflow/rf-detr/blob/5b22dfc0940697ce1abdfa681a5f7392b3eddbfb/README.md#license"

[io]
input = "imagenet"  # the runner resizes to the variant's square resolution (bilinear, no antialiasing) and normalises itself

[options]
score_threshold = { default = 0.5, min = 0.0, max = 1.0 }  # upstream predict() default; COCO evaluation uses 0.0
max_detections = { default = 100, min = 1 }  # COCO evaluation keeps the best 100 per image

[params]
encoder = "dinov2_windowed_small"
out_feature_indexes = [3, 6, 9, 12]
vit_encoder_num_layers = 12
hidden_dim = 256
patch_size = 16
num_windows = 2
resolution = 576
positional_encoding_size = 36
dec_layers = 4
sa_nheads = 8
ca_nheads = 16
dec_n_points = 2
dim_feedforward = 2048
num_queries = 300
num_select = 300
group_detr = 13
projector_scale = ["P4"]
num_classes = 90  # COCO category ids 1..90 (+ id 0); unused ids are dropped
two_stage = true
bbox_reparam = true
lite_refpoint_refine = true
layer_norm = true
use_grouppose_keypoints = false
num_keypoints_per_class = []
keypoint_cross_attn = true
inter_instance_kp_attn = false
grouppose_keypoint_dim_downscale = 1
dual_projector = false
dual_projector_kp_only = false
num_decoder_registers = 0
segmentation_head = false
mask_downsample_ratio = 4
trace_alpha = 0.2

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fastbb"]  # packed-QKV flash attention in the backbone, CUDA graph replay of the network

[output]
label_set = "coco-80"

[[variants]]
id = "rf-detr-n-coco"
revision = 1
