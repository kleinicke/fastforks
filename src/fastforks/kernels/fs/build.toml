# Built by tools/build_kernels.py into one cubin per target; manifest.toml is generated from it.
kind = "cubin"
sources = ["fs_kernels.cu"]
targets = ["sm_80", "sm_86", "sm_89", "sm_90", "sm_100", "sm_120", "compute_80"]
flags = ["-O3", "-std=c++17", "--expt-relaxed-constexpr"]
# Licence and provenance of this kernel library; copied into manifest.toml (not part of the build id).
licence = "Apache-2.0"
derived_from = "our FoundationStereo fork (cuda-kernels 683f110), written from our own RAFT / IGEV kernels; no NVIDIA code"
