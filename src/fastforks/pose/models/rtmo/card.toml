schema = 2
name = "RTMO"
summary = "RTMO (Lu et al. 2024): real-time one-stage multi-person 2D pose from OpenMMLab. A YOLOX-style CSPDarknet backbone, a hybrid encoder neck (one transformer layer on the coarsest map) and a head that predicts, per grid cell, a person score, a box and a pose vector; a dynamic coordinate classifier turns each kept pose vector into the 17 COCO keypoints over 1D bins that span the person's box. Takes the whole image without person boxes or a separate detector: the backbone runs once per image, while decoding and NMS depend on the detections. The image is letterboxed to 640 x 640 (416 x 416 for `rtmo-t`); vendored from mmpose (no mmpose / mmcv dependency). The portable `module()` maps the letterboxed image to the head's per-cell outputs (decoding and NMS stay outside)."
tier = "stable"
limitations = ["module() exports the letterboxed-image network and raw per-cell head outputs; coordinate decoding and NMS remain outside the exported graph.", "Float16 and float32 can retain different people near the score threshold."]
outputs = ["keypoints", "keypoint_scores", "boxes", "scores"]

[upstream]
repo = "https://github.com/open-mmlab/mmpose"
commit = "5408bc76f5b848cf925a0d1857899011d8c5b497"  # v1.3.2; net.py condenses RTMOHead, HybridEncoder and mmdet 3.3.0's CSPDarknet (both Apache-2.0, OpenMMLab)

[licence]
code = "Apache-2.0"  # open-mmlab/mmpose LICENSE (mmdet's CSPDarknet: the same licence and authors)
weights = "Apache-2.0"  # the model zoo checkpoints are released with the repository (README: Apache 2.0)
files = ["LICENSE"]
training_data = ["coco", "aic", "crowdpose", "mpii", "jhmdb", "halpe", "posetrack18"]
training_note = "body7: COCO, AI Challenger, CrowdPose, MPII, sub-JHMDB, Halpe and PoseTrack18 keypoints; the CSPDarknet backbone starts from a YOLOX COCO detection checkpoint"
evidence = "https://github.com/open-mmlab/mmpose/blob/5408bc76f5b848cf925a0d1857899011d8c5b497/README.md#license"

[io]
input = "imagenet"  # the runner letterboxes the image to the network size itself; the network reads 0..255 unnormalised

[options]
score_threshold = { default = 0.1, min = 0.0, max = 1.0 }  # minimum person score (the reference's test_cfg)

[params]
deepen = 0.67
widen = 0.75
keypoints = 17
size = 640
nms_iou = 0.65  # reference test_cfg

[modes.portable]
cuda_dtype = "float16"  # letterbox, the coordinate classifier, decoding and NMS stay float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]  # the CSPDarknet backbone through fastforks._optimize (fused conv + SiLU, residual, concat); fp16 neck and head

[output]
label_set = "coco-keypoints-17"

