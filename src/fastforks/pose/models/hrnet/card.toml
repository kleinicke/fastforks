schema = 2
name = "HRNet"
summary = "HRNet (Sun et al. 2019): top-down 2D human pose with a high-resolution CNN that keeps a 1/4-scale branch through the whole network and repeatedly exchanges features with three coarser parallel branches; a 1 x 1 conv on the finest branch gives one heatmap per keypoint, decoded as its maximum moved a quarter heatmap pixel towards the larger neighbour. The mmpose COCO checkpoints (w32 / w48, 256 x 192 and 384 x 288) return the 17 COCO keypoints. Takes person boxes (e.g. from `fastforks.detection`) and crops each at the network size; vendored from mmpose (no mmpose / mmcv dependency). The portable `module()` maps crops to heatmaps."
tier = "stable"
uses = ["topdown"]  # shared modules imported directly by this family
outputs = ["keypoints", "keypoint_scores", "boxes", "scores"]

[upstream]
repo = "https://github.com/open-mmlab/mmpose"
commit = "5408bc76f5b848cf925a0d1857899011d8c5b497"  # v1.3.2; net.py condenses the HRNet backbone and HeatmapHead, model.py the MSRAHeatmap codec (Apache-2.0, OpenMMLab)

[licence]
code = "Apache-2.0"  # open-mmlab/mmpose LICENSE
weights = "Apache-2.0"  # the model zoo checkpoints are released with the repository (README: Apache 2.0)
files = ["LICENSE"]
training_data = ["coco", "imagenet-1k"]
training_note = "COCO 2017 keypoints; the HRNet backbone was initialised from ImageNet-1k classification weights"
evidence = "https://github.com/open-mmlab/mmpose/blob/5408bc76f5b848cf925a0d1857899011d8c5b497/README.md#license"

[io]
input = "imagenet"  # the runner crops each box at the network size and normalises the crops itself (0..255 mmpose means)

[options]
flip_test = { default = false }  # true: average with the mirrored crop's shifted heatmaps (mmpose's COCO AP protocol; two network passes)

[params]
channels = 32
keypoints = 17
height = 256
width = 192

[modes.portable]
cuda_dtype = "float16"  # crops, decoding and keypoint mapping stay float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]  # the network through fastforks._optimize (BatchNorm folded, fused conv + ReLU / residual, fp16, channels-last)

[output]
label_set = "coco-keypoints-17"

[[variants]]
id = "hrnet-w32"  # HRNet-W32, 256 x 192; COCO val AP 74.6 (detector boxes, flip test)
revision = 1
params = {}
weights = [{ name = "hrnet-w32-coco-256x192.pth", size = 121739901, sha256 = "81c58e403a1ba13a741eb02ba790b5b78bff2a45a9390feebf875f43b8502c8f", url = "https://download.openmmlab.com/mmpose/v1/body_2d_keypoint/topdown_heatmap/coco/td-hm_hrnet-w32_8xb64-210e_coco-256x192-81c58e40_20220909.pth" }]

