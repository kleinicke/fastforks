schema = 2
name = "RTMPose"
summary = "RTMPose (Jiang et al. 2023): real-time top-down 2D human pose from OpenMMLab: a CSPNeXt CNN backbone and a SimCC head (a gated attention unit over one token per keypoint, then x and y classified as 1D bins at half-pixel resolution, no heatmaps). The body7 checkpoints (trained on seven public pose datasets) return the 17 COCO keypoints; the DWPose ones (Yang et al. 2023, distilled on COCO-WholeBody + UBody, the pose model of ControlNet's openpose preprocessors) the 133 COCO-WholeBody keypoints (body, feet, face, both hands). The RTMW ones (Jiang et al. 2024: a PAFPN neck and a two-scale head on the same backbone, trained on 14 datasets) return the same 133 keypoints more accurately. More model-zoo checkpoints of the same network: `-halpe26` (body + feet, 26 keypoints), `-hand5` (21 keypoints of a hand box), `-face6` (106 face landmarks of a face box) and `-ap10k` (17 keypoints of an animal box). Takes person boxes (e.g. from `fastforks.detection`) and crops each at 256 x 192 (or 384 x 288; hand, face and animal boxes: 256 x 256); vendored from mmpose (no mmpose / mmcv dependency). The portable `module()` maps crops to SimCC logits."
tier = "stable"
uses = ["cspnext", "cuda_graphs", "topdown"]  # shared modules imported directly by this family
outputs = ["keypoints", "keypoint_scores", "boxes", "scores"]

[upstream]
repo = "https://github.com/open-mmlab/mmpose"
commit = "5408bc76f5b848cf925a0d1857899011d8c5b497"  # v1.3.2; net.py condenses RTMCCHead, RTMWHead, CSPNeXtPAFPN and mmdet 3.3.0's CSPNeXt (both Apache-2.0, OpenMMLab)

[licence]
code = "Apache-2.0"  # open-mmlab/mmpose LICENSE (mmdet's CSPNeXt: the same licence and authors)
weights = "Apache-2.0"  # the model zoo checkpoints are released with the repository (README: Apache 2.0)
files = ["LICENSE"]
training_data = ["coco", "aic", "crowdpose", "mpii", "jhmdb", "halpe", "posetrack18", "imagenet-1k"]
training_note = "body7: COCO, AI Challenger, CrowdPose, MPII, sub-JHMDB, Halpe and PoseTrack18 keypoints; the CSPNeXt backbone was pre-trained on ImageNet-1k (and on the same pose data, `pt-body7`)"
evidence = "https://github.com/open-mmlab/mmpose/blob/5408bc76f5b848cf925a0d1857899011d8c5b497/README.md#license"

[io]
input = "imagenet"  # the runner crops each box at the network size and normalises the crops itself (0..255 mmpose means)

[options]
flip_test = { default = false }  # true: average with the mirrored crop (mmpose's COCO AP protocol; two network passes)

[params]
deepen = 0.67
widen = 0.75
keypoints = 17
height = 256
width = 192
conv_accumulation_channels = 0  # kernels: zero keeps the standard fp16 accumulation recipe
neck = false  # true: RTMW (PAFPN neck + two-scale head)

[modes.portable]
cuda_dtype = "float16"  # crops, decoding and keypoint mapping stay float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]  # the CSPNeXt backbone through fastforks._optimize (fused conv + SiLU, residual, concat); fp16 SimCC head
mps_kernels = ["pose_metal"]  # the OpenCV-style crops in one pass (the network: portable; fp16 is not faster on MPS)
mps_dtype = "float32"  # fp16 is not faster on MPS and moves unsure keypoints more (dwpose-l: up to 81 px)

[output]
label_set = "coco-keypoints-17"

