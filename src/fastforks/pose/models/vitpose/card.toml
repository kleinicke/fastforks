schema = 2
name = "ViTPose / ViTPose++"
summary = "ViTPose (Xu et al. 2022): top-down 2D human pose with a plain ViT encoder and a light deconvolution (or bilinear) decoder; ViTPose++ trains one backbone on six pose datasets with per-dataset MLP experts. Takes person boxes (e.g. from `fastforks.detection`), crops each at 256 x 192 and returns the 17 COCO keypoints with DARK sub-pixel decoding. The portable `module()` maps crops to heatmaps."
tier = "stable"
outputs = ["keypoints", "keypoint_scores", "boxes", "scores"]

[upstream]
repo = "https://github.com/huggingface/transformers"  # VitPoseForPoseEstimation + VitPoseImageProcessor (port of ViTAE-Transformer/ViTPose)
commit = "v4.57.1"

[[upstream.official]]
repo = "https://github.com/ViTAE-Transformer/ViTPose"
framework = "PyTorch"
reason = "The authors' code is built on mmpose; the Hugging Face transformers port is dependency-light and ships the converted weights."

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # HF model cards of usyd-community/vitpose-*: "license: apache-2.0"; ViTPose repo: Apache-2.0
files = ["LICENSE"]
training_data = ["coco", "imagenet-1k"]
training_note = "COCO 2017 keypoints; the ViT was initialised from MAE ImageNet-1k pre-training"
evidence = "https://huggingface.co/usyd-community/vitpose-base-simple (model card licence)"

[io]
input = "imagenet"  # the runner crops each box at 256 x 192 and normalises the crops itself

[options]
fp32_accumulate = { default = false, effect = "precision" }  # true: kernels run every GEMM through cuBLAS with fp32 accumulation (the portable precision, with the CUDA graphs); slower on GeForce (half-rate fp32 accumulation)

[params]
dim = 768
depth = 12
heads = 12
part = 0
experts = 0
decoder = "classic"
keypoints = 17
height = 256
width = 192

[modes.portable]
cuda_dtype = "float16"  # crops, decoding and keypoint mapping stay float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fvm_conv"]  # token GEMMs with fused bias / GELU / residual epilogues; attention (flash SDPA) and the decoder (cuDNN) stay torch
mps_kernels = ["pose_metal"]  # patch embedding and decoder as GEMMs + Metal overlap-add, DARK decoding in one pass
# no mps_dtype: float16 stays; M1 Pro, vitpose-base: 7-10 % faster than float32 (25.6 vs 28.1 ms, 2 people), 0.04 px mean / 0.33 px p99 from the golden

[output]
label_set = "coco-keypoints-17"

[[papers]]
title = "ViTPose: Simple Vision Transformer Baselines for Human Pose Estimation"
url = "https://arxiv.org/abs/2204.12484"
date = "2022-04-26"
venue = "NeurIPS 2022"
variants = ["vitpose-base-simple", "vitpose-base"]

[[papers]]
title = "ViTPose++: Vision Transformer for Generic Body Pose Estimation"
url = "https://arxiv.org/abs/2212.04246"
date = "2022-12-07"
venue = "TPAMI 2023"
variants = ["vitpose-plus-small", "vitpose-plus-base", "vitpose-plus-large", "vitpose-plus-huge"]

