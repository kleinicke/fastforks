schema = 2
name = "DenseNet"
summary = "DenseNet (Huang et al. 2016): densely connected convolution blocks."
tier = "stable"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/pytorch/vision"
commit = "1f1a920d685d46dfbe187934b785b7ecb7a182f2"  # torchvision v0.29.1: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/liuzhuang13/DenseNet"
framework = "Lua Torch (the same repo also lists Caffe/PyTorch ports by the authors)"
reason = "The authors' code is Lua Torch; torchvision's PyTorch port carries ImageNet weights."

[licence]
code = "BSD-3-Clause"  # torchvision
weights = "assumed from code"  # torchvision states no separate weights licence
files = []  # no vendored code: the architecture is torchvision's own module
training_data = ["imagenet-1k"]
evidence = "https://github.com/pytorch/vision/blob/1f1a920d685d46dfbe187934b785b7ecb7a182f2/LICENSE"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 256
crop = 224
interpolation = "bilinear"

[params]
library = "torchvision"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.HACC_PIX`; CNNs on `cudnn_hacc`): inputs of at least 8 x 224 x 224 pixels (batch
# * H * W) run the fp16-accumulate cuDNN convs (`cudnn_hacc`, plans built on the first call of a size); smaller, launch-bound inputs run the
# same optimized network on plain fp16 cuDNN convs, which are faster there. This is not a fallback to the portable model.

[output]
label_set = "imagenet-1k"

[[papers]]
title = "Densely Connected Convolutional Networks"
url = "https://arxiv.org/abs/1608.06993"
date = "2016-08-25"
venue = "CVPR 2017"

[[variants]]
id = "densenet121.tv_in1k"
default_tag = true
revision = 1
weights = [{ name = "densenet121-a639ec97.pth", size = 32342954, sha256 = "a639ec97d7c33b07ae66f0b5fb7d0192f95a3b11b7576c66c0126c2a727c4395", url = "https://download.pytorch.org/models/densenet121-a639ec97.pth" }]
params = { arch = "densenet121" }
