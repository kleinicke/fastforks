weights = [{ name = "fastvit_t8.apple_dist_in1k.safetensors", size = 16266976, sha256 = "9e31da81a225d20bc9e326baf1cc88ccc0e68fe2c43ea0154a870c409747f6aa", url = "https://huggingface.co/timm/fastvit_t8.apple_dist_in1k/resolve/09215e34b4f178654bf6efc44131c50aa865779a/model.safetensors" }]
params = { arch = "fastvit_t8.apple_dist_in1k" }

