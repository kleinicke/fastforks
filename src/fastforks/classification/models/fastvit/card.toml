schema = 2
name = "FastViT"
summary = "FastViT (Vasu et al. 2023): reparameterisable RepMixer token mixing, attention in the last stage."
tier = "stable"
licence_notes = [
  "The weights are under Apple's sample-code licence (the timm Hugging Face card says only 'license: other'); that licence grants no patent rights.",
]
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[licence]
code = "Apache-2.0"  # timm
weights = "LicenseRef-Apple-Sample-Code"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
evidence = "https://huggingface.co/timm/fastvit_sa24.apple_dist_in1k/blob/0b86f2b98f83274e9f03b6ddbcb3942b84efb839/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 284
crop = 256
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.HACC_PIX`; CNNs on `cudnn_hacc`): inputs of at least 8 x 224 x 224 pixels (batch
# * H * W) run the fp16-accumulate cuDNN convs (`cudnn_hacc`, plans built on the first call of a size); smaller, launch-bound inputs run the
# same optimized network on plain fp16 cuDNN convs, which are faster there. This is not a fallback to the portable model.

[output]
label_set = "imagenet-1k"

[[variants]]
id = "fastvit_sa24.apple_dist_in1k"
default_tag = true
revision = 1
weights = [{ name = "fastvit_sa24.apple_dist_in1k.safetensors", size = 86553584, sha256 = "c38594c380a5542da9e6ac3c36af95ab180d54e8982c822c677e452e03217a10", url = "https://huggingface.co/timm/fastvit_sa24.apple_dist_in1k/resolve/0b86f2b98f83274e9f03b6ddbcb3942b84efb839/model.safetensors" }]
params = { arch = "fastvit_sa24.apple_dist_in1k" }
