schema = 2
name = "EVA-02"
summary = "EVA-02 (Fang et al. 2023): ViT with SwiGLU and rotary position embeddings, MIM pre-trained."
tier = "stable"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/baaivision/EVA"
framework = "PyTorch"
reason = "timm re-implements the model with the released weights in a uniform API."

[licence]
code = "Apache-2.0"  # timm
weights = "MIT"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["merged-38m", "imagenet-21k", "imagenet-1k"]
evidence = "https://huggingface.co/timm/eva02_large_patch14_448.mim_m38m_ft_in22k_in1k/blob/fae13da496eea422cb162dfdb693dc125b68f04d/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "mean_std"
resize = 448
crop = 448
interpolation = "bicubic"
mean = [0.48145466, 0.4578275, 0.40821073]
std = [0.26862954, 0.26130258, 0.27577711]

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.transformer.lin`): a GEMM with a residual add, fewer than 2048 rows (batch x
# tokens) and at least 2^29 multiply-adds runs cuBLAS + add instead of the fused CUTLASS GEMM, which is faster there;
# every other GEMM is the fused kernel. EVA-02-L 448 (1025 rows, attention projection and MLP down-projection) hits it. The choice depends on the shape only, so two batch sizes of one image can
# take different GEMM paths (fp16 rounding differs at the last bit). Measured with the rule on vs off: eva02_large_448 14.42 vs 14.53 ms (rule off).

[output]
label_set = "imagenet-1k"

[[papers]]
title = "EVA-02: A Visual Representation for Neon Genesis"
url = "https://arxiv.org/abs/2303.11331"
date = "2023-03-20"
venue = "Image and Vision Computing 2024 (vol. 149, 105171)"

[[variants]]
# timm resizes to a square (crop_mode squash); fastforks resizes the shorter side and centre-crops
id = "eva02_large_patch14_448.mim_m38m_ft_in22k_in1k"
default_tag = true
revision = 1
weights = [{ name = "eva02_large_patch14_448.mim_m38m_ft_in22k_in1k.safetensors", size = 1220365908, sha256 = "1b54182f1f92613b96bc9e325f3795bde38bd1708233bb77a07d5c52eed2d638", url = "https://huggingface.co/timm/eva02_large_patch14_448.mim_m38m_ft_in22k_in1k/resolve/fae13da496eea422cb162dfdb693dc125b68f04d/model.safetensors" }]
params = { arch = "eva02_large_patch14_448.mim_m38m_ft_in22k_in1k" }
