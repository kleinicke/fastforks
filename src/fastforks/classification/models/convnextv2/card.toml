schema = 2
name = "ConvNeXt V2"
summary = "ConvNeXt V2 (Woo et al. 2023): ConvNeXt blocks with global response normalisation, FCMAE pre-training."
tier = "stable"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/facebookresearch/ConvNeXt-V2"
framework = "PyTorch"
reason = "timm re-implements the architecture and hosts the converted FCMAE fine-tuned weights."

[licence]
code = "Apache-2.0"  # timm
weights = "CC-BY-NC-4.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-21k", "imagenet-1k"]
evidence = "https://huggingface.co/timm/convnextv2_base.fcmae_ft_in22k_in1k/blob/9e250ed8f88b436472d2b24af26f82a8aa8c719d/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 256
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.transformer.lin`): a GEMM with a residual add, fewer than 2048 rows (batch x
# tokens) and at least 2^29 multiply-adds runs cuBLAS + add instead of the fused CUTLASS GEMM, which is faster there;
# every other GEMM is the fused kernel. The MLP down-projection (rows = batch x H x W of the stage) uses it when it fits the thresholds. The choice depends on the shape only, so two batch sizes of one image can
# take different GEMM paths (fp16 rounding differs at the last bit). Measured with the rule on vs off: not separately measured.

[output]
label_set = "imagenet-1k"

[[papers]]
title = "ConvNeXt V2: Co-designing and Scaling ConvNets with Masked Autoencoders"
url = "https://arxiv.org/abs/2301.00808"
date = "2023-01-02"
venue = "CVPR 2023"

[[variants]]
id = "convnextv2_base.fcmae_ft_in22k_in1k"
default_tag = true
revision = 1
weights = [{ name = "convnextv2_base.fcmae_ft_in22k_in1k.safetensors", size = 354909632, sha256 = "3b04d2fd7f5268b706210542bd6b6833ad75d6a5e4612a1ae34e8414dbd50b81", url = "https://huggingface.co/timm/convnextv2_base.fcmae_ft_in22k_in1k/resolve/9e250ed8f88b436472d2b24af26f82a8aa8c719d/model.safetensors" }]
params = { arch = "convnextv2_base.fcmae_ft_in22k_in1k" }
