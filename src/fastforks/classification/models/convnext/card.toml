id = "convnext_tiny.fb_in1k"
revision = 1
weights = [{ name = "convnext_tiny.fb_in1k.safetensors", size = 114374272, sha256 = "08b9dc9c3a3a29421de7996761e176501896d1ae7fc3085cf56a643772329276", url = "https://huggingface.co/timm/convnext_tiny.fb_in1k/resolve/b43a6303c9fcf176d2d707478a128c2c91e93528/model.safetensors" }]
