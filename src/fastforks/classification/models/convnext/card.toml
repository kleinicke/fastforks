schema = 2
name = "ConvNeXt"
summary = "ConvNeXt (Liu et al. 2022): a pure convolutional network of 7x7 depthwise conv + LayerNorm + MLP blocks, Meta's ImageNet-1k and ImageNet-22k checkpoints."
tier = "stable"
outputs = ["logits"]
uses = ["cuda_graphs", "libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/facebookresearch/ConvNeXt"
framework = "PyTorch"
reason = "timm ships a maintained re-implementation with the same Meta ImageNet-1k/22k weights and a uniform API."

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are Meta's (facebookresearch/ConvNeXt, MIT:
# https://github.com/facebookresearch/ConvNeXt/blob/048efcea897d999aed302f2639b6270aedf8d4c8/LICENSE), converted to
# safetensors by timm, whose model cards of all 12 repositories state apache-2.0.
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-21k", "imagenet-1k"]
evidence = "https://huggingface.co/timm/convnext_base.fb_in22k_ft_in1k/blob/67758fcbcf9f007ec7630bf8636b74a8f24e52a0/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 256
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
# Own runner (model.py), measured on an RTX 5060 Ti against the generic `_optimize` ConvNeXt path (what ConvNeXt V2
# gets: fused GEMMs with the LayerScale folded into the second one, fvm depthwise conv, one CUDA graph):
#   kept: fvm_seg LayerNorm (0-4 % at batch 1, 7-13 % at batch 8), fused stem / downsampling convolutions (1-2 %),
#     cuBLAS for GEMMs of <= 600 rows (7-12 % at batch 1), cuDNN depthwise conv for maps of <= 256 rows (3-7 % at
#     batch 1 of the 224 variants).
#   not kept: fp32-accumulate second GEMM for wide layers (no accuracy gain, Large 3.45 -> 3.88 ms), cuBLAS above 600
#     rows (slower at batch 8), cuDNN depthwise conv everywhere (wins at batch 8, loses at batch 4 and at 384).
#   LayerNorm fused into the depthwise conv would need a new kernel (the norm needs the whole channel vector of a
#     pixel, the conv writes channel by channel): not built.
# Not built, for datacenter GPUs (A100 / L40S / H100 class): batch 1 is launch bound there (~100 launches per call),
# so batching is where the headroom is (a graph per batch size exists up to 2^20 input pixels; raise it and re-measure
# the two row thresholds, which are tuned for this card); TF32 / fp32 accumulation costs nothing there but buys no
# accuracy here (fp16 top-1 = fp32 top-1); bf16 has no fused conv kernels; INT8 belongs to a TensorRT export.
kernels = ["fvm_conv", "fvm_seg"]  # _optimize.conv_ops (fvm_conv) + fvm_seg: the only libraries this family imports

[output]
label_set = "imagenet-1k"

[[papers]]
title = "A ConvNet for the 2020s"
url = "https://arxiv.org/abs/2201.03545"
date = "2022-01-10"
venue = "CVPR 2022"

