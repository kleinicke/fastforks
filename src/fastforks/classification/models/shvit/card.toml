schema = 2
name = "SHViT"
summary = "SHViT (Yun and Ro 2024): a small classifier with a 16x16 convolutional stem and single-head attention on a part of the channels."
tier = "experimental"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/ysj9909/SHViT"
framework = "PyTorch"
reason = "timm carries the architecture and the converted authors' checkpoints in its own, simpler API."

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are the authors' (ysj9909/SHViT, MIT: https://github.com/ysj9909/SHViT/blob/main/LICENSE; GitHub
# reports NOASSERTION because the file also lists third-party MIT notices), converted to safetensors by timm, whose
# model cards of all 4 repositories state mit (checked 2026-11-10: https://huggingface.co/api/models/timm/<id>,
# cardData.license).
weights = "MIT"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
evidence = "https://huggingface.co/timm/shvit_s1.in1k/blob/d5c0c27b0d05c630284a3946882590e4054f1108/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 256
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not built yet: convolutions with BatchNorm plus single-head attention on feature maps need a dedicated kernels runner"

[output]
label_set = "imagenet-1k"

[[papers]]
title = "SHViT: Single-Head Vision Transformer with Memory Efficient Macro Design"
url = "https://arxiv.org/abs/2401.16456"
date = "2024-01-29"
venue = "CVPR 2024"

[[variants]]
id = "shvit_s1.in1k"
default_tag = true
revision = 1
