schema = 2
name = "EfficientFormerV2"
summary = "EfficientFormerV2 (Li et al. 2022, Snap Research): a mobile hybrid classifier, convolutional stages with attention in the last two."
tier = "experimental"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are Snap Research's (snap-research/EfficientFormer; its LICENSE is an MIT-style grant by Snap Inc.
# plus LeViT's Apache-2.0: https://github.com/snap-research/EfficientFormer/blob/main/LICENSE; the official files are
# on Google Drive without a separate statement), re-hosted by timm, whose model cards of all 4 repositories state
# apache-2.0 (checked 2026-11-10: https://huggingface.co/api/models/timm/<id>, cardData.license).
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
evidence = "https://huggingface.co/timm/efficientformerv2_s0.snap_dist_in1k/blob/aa226e91a076e760bc7957e5990f19f6ae322c5f/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 235
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not built yet: Conv-BN blocks with depthwise 3x3, feature-map attention with learned bias tables and strided depthwise convolutions need a dedicated kernels runner"

[output]
label_set = "imagenet-1k"

[[variants]]
id = "efficientformerv2_s0.snap_dist_in1k"
default_tag = true
revision = 1
weights = [{ name = "efficientformerv2_s0.snap_dist_in1k.safetensors", size = 14659080, sha256 = "ad4ce93472a2589572d46370ea214937a10bd522e35da9ccb7b10fd7eeb68f0c", url = "https://huggingface.co/timm/efficientformerv2_s0.snap_dist_in1k/resolve/aa226e91a076e760bc7957e5990f19f6ae322c5f/model.safetensors" }]
params = { arch = "efficientformerv2_s0.snap_dist_in1k" }
