schema = 2
name = "Vision Transformer"
summary = "Vision Transformer (Dosovitskiy et al. 2020): 16x16 patches, pre-norm transformer encoder, class token."
tier = "stable"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/google-research/vision_transformer"
framework = "JAX"
reason = "The authors' code is JAX; timm's PyTorch port carries the converted AugReg weights (further fine-tuned by timm)."

[licence]
code = "Apache-2.0"  # timm
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-21k", "imagenet-1k"]
evidence = "https://huggingface.co/timm/vit_base_patch16_224.augreg2_in21k_ft_in1k/blob/063c6c38a5d8510b2e57df480445e94b231dad2c/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "mean_std"
resize = 248
crop = 224
interpolation = "bicubic"
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.transformer.lin`): a GEMM with a residual add, fewer than 2048 rows (batch x
# tokens) and at least 2^29 multiply-adds runs cuBLAS + add instead of the fused CUTLASS GEMM, which is faster there;
# every other GEMM is the fused kernel. ViT-L/16 384 hits it (576 rows), ViT-B/16 224 (197 rows) does not. The choice depends on the shape only, so two batch sizes of one image can
# take different GEMM paths (fp16 rounding differs at the last bit). Measured with the rule on vs off: vit_base_patch16_224 2.92 vs 2.93 ms (rule not hit).

[output]
label_set = "imagenet-1k"

[[papers]]
title = "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
url = "https://arxiv.org/abs/2010.11929"
date = "2020-10-22"
venue = "ICLR 2021"

[[papers]]
title = "How to train your ViT? Data, Augmentation, and Regularization in Vision Transformers"
url = "https://arxiv.org/abs/2106.10270"
date = "2021-06-18"
venue = "TMLR 2022"

[[variants]]
id = "vit_base_patch16_224.augreg2_in21k_ft_in1k"
default_tag = true
revision = 1
weights = [{ name = "vit_base_patch16_224.augreg2_in21k_ft_in1k.safetensors", size = 346284714, sha256 = "32aa17d6e17b43500f531d5f6dc9bc93e56ed8841b8a75682e1bb295d722405b", url = "https://huggingface.co/timm/vit_base_patch16_224.augreg2_in21k_ft_in1k/resolve/063c6c38a5d8510b2e57df480445e94b231dad2c/model.safetensors" }]
params = { arch = "vit_base_patch16_224.augreg2_in21k_ft_in1k" }
