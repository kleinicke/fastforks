schema = 2
name = "HGNetV2"
summary = "HGNetV2 (PaddlePaddle, PP-HGNetV2): a convolutional classifier of aggregation blocks with light 5x5 convolutions, SSLD-distilled and fine-tuned on ImageNet-1k."
tier = "experimental"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are PaddleClas' (PP-HGNetV2 SSLD stage 2, Apache-2.0:
# https://github.com/PaddlePaddle/PaddleClas/blob/release/2.6/LICENSE), converted by timm, whose model cards of all 7
# repositories state apache-2.0 (checked 2026-11-10: https://huggingface.co/api/models/timm/<id>, cardData.license).
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-21k", "imagenet-1k"]
evidence = "https://huggingface.co/timm/hgnetv2_b0.ssld_stage2_ft_in1k/blob/9e0a904b210d65e4fcd6582f8ca6e0921fac2650/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 232
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not built yet: the portable CNN path is validated; HGNetV2 aggregation blocks need a dedicated kernels runner"

[output]
label_set = "imagenet-1k"

