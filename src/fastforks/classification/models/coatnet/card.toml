schema = 2
name = "CoAtNet"
summary = "CoAtNet (Dai et al. 2021) in timm's `rw` configurations: MBConv stages followed by transformer stages with relative position bias."
tier = "experimental"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[licence]
code = "Apache-2.0"  # timm
# The checkpoints were trained in timm by its author (not converted from the paper's unreleased weights); timm's code
# is Apache-2.0 (https://github.com/huggingface/pytorch-image-models/blob/main/LICENSE) and the model cards of all 10
# repositories state apache-2.0 (checked 2026-11-10: https://huggingface.co/api/models/timm/<id>, cardData.license).
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
evidence = "https://huggingface.co/timm/coatnet_nano_rw_224.sw_in1k/blob/89fb9ccadc876a973c6ff954b089eb6723174c7a/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "mean_std"
resize = 235
crop = 224
interpolation = "bicubic"
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not implemented: MBConv stages plus attention with a relative position bias: needs its own runner"

[output]
label_set = "imagenet-1k"

[[papers]]
title = "CoAtNet: Marrying Convolution and Attention for All Data Sizes"
url = "https://arxiv.org/abs/2106.04803"
date = "2021-06-09"
venue = "NeurIPS 2021"

