schema = 2
name = "ResNet"
summary = "ResNet (He et al. 2015): residual basic / bottleneck blocks."
tier = "stable"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/pytorch/vision"
commit = "1f1a920d685d46dfbe187934b785b7ecb7a182f2"  # torchvision v0.29.1: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/KaimingHe/deep-residual-networks"
framework = "Caffe"
reason = "The authors' code and weights are Caffe; torchvision's PyTorch implementation is used, and the tv/tv2 weights are torchvision's own trainings."

[licence]
code = "BSD-3-Clause"  # torchvision
weights = "assumed from code"  # torchvision states no separate weights licence
files = []  # no vendored code: the architecture is torchvision's own module
training_data = ["imagenet-1k"]
evidence = "https://github.com/pytorch/vision/blob/1f1a920d685d46dfbe187934b785b7ecb7a182f2/LICENSE"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 256
crop = 224
interpolation = "bilinear"

[params]
library = "torchvision"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.HACC_PIX`; CNNs on `cudnn_hacc`): inputs of at least 8 x 224 x 224 pixels (batch
# * H * W) run the fp16-accumulate cuDNN convs (`cudnn_hacc`, plans built on the first call of a size); smaller, launch-bound inputs run the
# same optimized network on plain fp16 cuDNN convs, which are faster there. This is not a fallback to the portable model.

[output]
label_set = "imagenet-1k"

[[papers]]
title = "Deep Residual Learning for Image Recognition"
url = "https://arxiv.org/abs/1512.03385"
date = "2015-12-10"
venue = "CVPR 2016"

[[variants]]
id = "resnet18.tv_in1k"
default_tag = true
revision = 1
weights = [{ name = "resnet18-f37072fd.pth", size = 46830571, sha256 = "f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec", url = "https://download.pytorch.org/models/resnet18-f37072fd.pth" }]
params = { arch = "resnet18" }

[[variants]]
id = "resnet50.tv2_in1k"
default_tag = true
revision = 1
weights = [{ name = "resnet50-11ad3fa6.pth", size = 102540417, sha256 = "11ad3fa62ca79e40addfd354a8ec4b7c75143b3038b8d2a807fbc68deab379ca", url = "https://download.pytorch.org/models/resnet50-11ad3fa6.pth" }]
params = { arch = "resnet50" }
io = { resize = 232 }

[[variants]]
id = "resnet152.tv2_in1k"
default_tag = true
revision = 1
weights = [{ name = "resnet152-f82ba261.pth", size = 241669177, sha256 = "f82ba2614b9f35a7e1b8a26c229c30845634c5921dbc66621c5a1a524f926e44", url = "https://download.pytorch.org/models/resnet152-f82ba261.pth" }]
params = { arch = "resnet152" }
io = { resize = 232 }
