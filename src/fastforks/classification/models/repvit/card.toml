schema = 2
name = "RepViT"
summary = "RepViT (Wang et al. 2024): a mobile CNN with the block layout of a ViT (3x3 depthwise token mixer, 1x1 channel mixer), re-parameterised to plain convolutions at load."
tier = "experimental"
limitations = [
  "The older aliases `repvit_m1` / `repvit_m2` / `repvit_m3` (`.dist_in1k`) that timm also lists are not shipped.",
]
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/THU-MIG/RepViT"
framework = "PyTorch"
reason = "timm carries the architecture and the converted authors' checkpoints in its own, simpler API."

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are the authors' (THU-MIG/RepViT, Apache-2.0:
# https://github.com/THU-MIG/RepViT/blob/298f42075eda5d2e6102559fad260c970769d34e/LICENSE), converted to safetensors
# by timm, whose model cards of all 10 repositories state apache-2.0.
weights = "Apache-2.0"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
training_note = "ImageNet-1k with distillation from a RegNetY-16GF teacher (RepViT paper), 300 or 450 epochs"
evidence = "https://huggingface.co/timm/repvit_m1_1.dist_450e_in1k/blob/ff441038a42982fff1c8c75be7c794f9ba76db72/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 235
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc", "fvm_conv", "fvm_extra", "fvm_mb", "fvm_r3"]
# Per-shape dispatch (kernels, `_optimize.HACC_PIX`; CNNs on `cudnn_hacc`): inputs of at least 8 x 224 x 224 pixels (batch
# * H * W) run the fp16-accumulate cuDNN convs (`cudnn_hacc`, plans built on the first call of a size); smaller, launch-bound inputs run the
# same optimized network on plain fp16 cuDNN convs, which are faster there. This is not a fallback to the portable model.

[output]
label_set = "imagenet-1k"

[[papers]]
title = "RepViT: Revisiting Mobile CNN From ViT Perspective"
url = "https://arxiv.org/abs/2307.09283"
date = "2023-07-18"
venue = "CVPR 2024"

