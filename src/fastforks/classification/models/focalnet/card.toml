weights = [{ name = "focalnet_tiny_srf.ms_in1k.safetensors", size = 113730688, sha256 = "fc5ae22ca9759f171412c54b6a866c0ca704946c5a92a011638fa6d2a052ce62", url = "https://huggingface.co/timm/focalnet_tiny_srf.ms_in1k/resolve/de75c3a73e9ed84fee554a7138d4bac119751645/model.safetensors" }]
