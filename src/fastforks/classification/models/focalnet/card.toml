schema = 2
name = "FocalNet"
summary = "FocalNet (Yang et al. 2022): a hierarchical classifier that replaces self-attention by focal modulation (stacked depthwise convolutions with gated aggregation)."
tier = "experimental"
outputs = ["logits"]
uses = ["libnet"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/pytorch-image-models"
commit = "0df212b369a5385b16dfe513d5143a7311ea1ddc"  # timm v1.0.30: the network is built by the installed library

[licence]
code = "Apache-2.0"  # timm
# The checkpoints are the authors' (microsoft/FocalNet, MIT: https://github.com/microsoft/FocalNet/blob/main/LICENSE),
# converted to safetensors by timm, whose model cards of all 6 repositories state mit (checked 2026-11-10:
# https://huggingface.co/api/models/timm/<id>, cardData.license).
weights = "MIT"  # the timm Hugging Face model card
files = []  # no vendored code: the architecture is timm's own module
training_data = ["imagenet-1k"]
evidence = "https://huggingface.co/timm/focalnet_tiny_srf.ms_in1k/blob/de75c3a73e9ed84fee554a7138d4bac119751645/README.md"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU): the image is resized (shorter side) and centre-cropped to the fixed native crop, so the network always sees the same size.
input = "imagenet"
resize = 248
crop = 224
interpolation = "bicubic"

[params]
library = "timm"

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "not implemented: LayerNorm blocks with depthwise convolutions and gated sums: needs its own runner"

[output]
label_set = "imagenet-1k"

[[variants]]
