licence = { training_data = ["flyingchairs", "sceneflow"], training_note = "FlyingChairs, then FlyingThings3D (part of SceneFlow)" }
weights = [{ name = "flowseek_T_CT.pth", size = 171031546, sha256 = "d4bdd10dc5ad9bce403c4b50715935cc1a25aee67d8a9fb1b03d6705b7857933", url = "https://drive.usercontent.google.com/download?id=1COOQFkMulzpBm4zMoWsaRGk7E3YcVr2I&export=download&confirm=t" }]
