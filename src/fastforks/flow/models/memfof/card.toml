weights = [{ name = "MEMFOF-Tartan-T-TSKH-spring.safetensors", size = 303172564, sha256 = "8ed2112222944e7eda3325b226dbc351a3a1c8a0453a982949bdc782de641419", url = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH-spring/resolve/bd8e677a6bafce8872494bc880abc0a38b515657/model.safetensors" }]
