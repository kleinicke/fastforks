schema = 2
name = "MEMFOF"
summary = "MEMFOF (Bargatin et al. 2025): memory-efficient multi-frame optical flow. A RAFT-style network at 1/16 resolution on three frames: a ResNet34 context encoder on all three, a GMA attention over the context, 1024-channel features with an all-pairs correlation pyramid toward the previous and the next frame, a ConvNeXt update block and convex 16x upsampling; it predicts the backward and the forward flow of the middle frame at once. The authors' released weights; the network is ported from msu-video-group/memfof. A pair (image1, image2) runs as upstream's first frame of a clip, the frames (image1, image1, image2), and returns its forward flow. Paper (three frames per prediction, the fine-tuned checkpoints): Spring test 1px 3.289 %, Sintel test EPE 0.963 (clean), KITTI 2015 test Fl-all 2.94 %."
tier = "experimental"
outputs = ["flow"]
uses = []  # fastforks.shared modules this family imports
limitations = ["Pairs only: the multi-frame input (a previous frame and the feature cache of upstream's video demo) is not exposed; each pair runs as the first frame of a clip."]

[upstream]
repo = "https://github.com/msu-video-group/memfof"
commit = "a51de9fc59c6fe20ba08e079372c7b583d58a712"  # net/ vendors memfof/{model,corr,extractor,gma,layer,update}.py and utils/utils.py

[licence]
code = "BSD-3-Clause"  # LICENSE: Copyright (c) 2024 Princeton Vision & Learning Lab, (c) 2025 MSU Graphics & Media Lab; net/resnet.py: torchvision (BSD-3-Clause)
weights = "BSD-3-Clause"  # Hugging Face model cards egorchistov/optical-flow-MEMFOF-*: "license: bsd-3-clause"
files = ["LICENSE", "LICENSE-torchvision"]
training_data = ["tartanair", "sceneflow", "sintel-flow", "kitti", "hd1k"]
training_note = "TartanAir, FlyingThings3D (part of SceneFlow), then a mix of FlyingThings3D, Sintel, KITTI 2015 and HD1K (TSKH), as upstream's config/train/*.json"
evidence = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH/blob/6c6c9aa3ad64f93aee8efbc2f7a6e4535814ee96/README.md"  # weights licence; code: https://github.com/msu-video-group/memfof/blob/a51de9fc59c6fe20ba08e079372c7b583d58a712/LICENSE

[io]
input = "mean_std"  # upstream: 2 * (x / 255) - 1, i.e. [0, 1] -> [-1, 1]
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]
min_size = 256  # 1/16 features with a 4-level pyramid: the coarsest level needs 2 px (the lookup normalises by size - 1)
pad = { multiple = 16, mode = "centre", fill = "replicate" }  # upstream InputPadder ('sintel' mode)

[options]
iters = { default = 8, min = 1 }  # flow updates after the initial regression (upstream demo and config/eval: 8; its Sintel evaluation: 16)

[params]
scale = 0  # upstream get_val_scale: the frames are resized by 2^scale (bilinear) and the flow is resized back and divided by 2^scale; 1 for its KITTI and Sintel evaluation, 0 for Spring and the demo

[modes.portable]
cuda_dtype = "float16"  # autocast for the encoders and the update block; correlation, lookup and upsampling in float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["raft_flow"]  # the correlation windows on the fly (four levels, 1024 channels, radius 4) instead of the all-pairs volumes; the network stays the portable fp16 one

[[papers]]
title = "MEMFOF: High-Resolution Training for Memory-Efficient Multi-Frame Optical Flow Estimation"
url = "https://arxiv.org/abs/2506.23151"
date = "2025-06-29"
venue = "ICCV 2025"

[[variants]]
id = "memfof"  # upstream MEMFOF-Tartan-T-TSKH (the general checkpoint of its demo)
revision = 1
weights = [{ name = "MEMFOF-Tartan-T-TSKH.safetensors", size = 303172564, sha256 = "5e1388c0d6de309855959cc4d449dbfc57d6cd6e3a8af440365ab30e34367b78", url = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH/resolve/6c6c9aa3ad64f93aee8efbc2f7a6e4535814ee96/model.safetensors" }]

[[variants]]
