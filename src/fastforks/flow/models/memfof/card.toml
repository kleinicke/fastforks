weights = [{ name = "MEMFOF-Tartan-T-TSKH-sintel.safetensors", size = 303172564, sha256 = "5f5dfcb7f66d222c06723ccee0148a3ffaa575d3901c8cb5065c2d239d03762e", url = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH-sintel/resolve/53575708ab235a6f75fdfe3c9d85218da4a6eaa4/model.safetensors" }]

