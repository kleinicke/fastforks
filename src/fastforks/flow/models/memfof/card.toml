revision = 1
params = { scale = 1 }
io = { min_size = 128 }  # 256 px after the doubling
licence = { training_data = ["tartanair", "sceneflow", "sintel-flow", "kitti", "hd1k"], training_note = "TartanAir, FlyingThings3D, the TSKH mix, then fine-tuned on KITTI 2015", evidence = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH-kitti/blob/c5df484ef137ca2ab9759f3458474a525747ef4d/README.md" }
weights = [{ name = "MEMFOF-Tartan-T-TSKH-kitti.safetensors", size = 303172564, sha256 = "747da9a7919da57c57862e56237ac149ad9995dfabe440055f14eb526d9918cd", url = "https://huggingface.co/egorchistov/optical-flow-MEMFOF-Tartan-T-TSKH-kitti/resolve/c5df484ef137ca2ab9759f3458474a525747ef4d/model.safetensors" }]

