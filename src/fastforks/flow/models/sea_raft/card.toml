schema = 2
name = "SEA-RAFT"
summary = "SEA-RAFT (Wang, Lipson & Deng 2024): RAFT with ResNet encoders, an initial flow regressed from the context features and a ConvNeXt update block, so 4 iterations suffice; correlation pyramid at 1/8 resolution, convex upsampling. The authors' released weights (pretrained on TartanAir); the network is ported from princeton-vl/SEA-RAFT. `sea-raft-m` / `sea-raft-s` are the general checkpoints (trained on the FlyingThings3D, Sintel, KITTI and HD1K mix); the `-spring` variants are made for 1080p footage and work at half resolution, as upstream evaluates them: the pair is halved (bilinear), the flow is upsampled and doubled. Paper (zero-shot after FlyingChairs + FlyingThings, the C-T weights): KITTI 2015 train EPE 4.29 / Fl-all 14.2 % (M), Sintel train EPE 1.21 clean / 4.04 final (M); M with 12 iterations (`iters=12`) is the paper's SEA-RAFT (L)."
tier = "experimental"
outputs = ["flow"]
uses = []  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/princeton-vl/SEA-RAFT"
commit = "9137517ba24e628442aec097d3afe71d03503b75"  # net.py ports core/raft.py, extractor.py, layer.py, update.py, corr.py

[licence]
code = "BSD-3-Clause"  # LICENSE: Copyright (c) 2024, Princeton Vision & Learning Lab
weights = "BSD-3-Clause"  # Hugging Face model cards MemorySlices/Tartan-C-T*: "license: bsd-3-clause"
files = ["LICENSE"]
training_data = ["tartanair", "flyingchairs", "sceneflow", "sintel-flow", "kitti", "hd1k"]
training_note = "TartanAir pretraining, FlyingChairs, FlyingThings3D (part of SceneFlow), then a mix of FlyingThings3D, Sintel, KITTI 2015 and HD1K (TSKH)"
evidence = "https://huggingface.co/MemorySlices/Tartan-C-T-TSKH432x960-M/blob/85a47dc9096cca6e907ef9100dc1847a19b26a2a/README.md"  # weights licence; the training stages are the names of upstream's config/train/*.json

[io]
input = "mean_std"  # upstream: 2 * (x / 255) - 1, i.e. [0, 1] -> [-1, 1]
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]
min_size = 128  # the 4-level correlation pyramid needs 1/8 feature maps of at least 16 px (as RAFT)
pad = { multiple = 8, mode = "centre", fill = "replicate" }  # upstream InputPadder ('sintel' mode)

[options]
iters = { default = 4, min = 1 }  # flow updates after the initial regression (upstream config/eval: 4; its "L" uses 12)

[params]
size = "medium"
scale = 0  # upstream config/eval "scale": the network runs on the pair resized by 2^scale (bilinear) and the flow is resized back and divided by 2^scale; -1 in upstream's spring-*.json, 0 in all others

[modes.portable]
cuda_dtype = "float16"  # autocast for the encoders and the update block; correlation, lookup and upsampling in float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["raft_flow", "cutlass_conv", "cudnn_hacc"]

[[variants]]
id = "sea-raft-m"  # upstream Tartan-C-T-TSKH432x960-M (its Sintel submission); Sintel test EPE 1.44 clean / 2.86 final (M)
revision = 1
weights = [{ name = "Tartan-C-T-TSKH432x960-M.safetensors", size = 78778760, sha256 = "83e4319d1029f414a342227db17f64089f21b7324da085122beb008aa9c4d0e5", url = "https://huggingface.co/MemorySlices/Tartan-C-T-TSKH432x960-M/resolve/85a47dc9096cca6e907ef9100dc1847a19b26a2a/model.safetensors" }]

[[variants]]
