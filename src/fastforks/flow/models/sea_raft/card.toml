revision = 1
licence = { training_data = ["tartanair", "flyingchairs", "sceneflow", "sintel-flow", "kitti", "hd1k"], training_note = "TartanAir, FlyingChairs, FlyingThings3D, the TSKH mix, then fine-tuned on KITTI 2015" }
weights = [{ name = "Tartan-C-T-TSKH-kitti432x960-M.safetensors", size = 78778760, sha256 = "9a2d2a9b9e788736c0f177a17edb8cfaa3a18542242dcaeaab3f41f957e4de5a", url = "https://huggingface.co/MemorySlices/Tartan-C-T-TSKH-kitti432x960-M/resolve/695dd3938858641b87d85b87d2e478004b4bdbbc/model.safetensors" }]

[[variants]]
