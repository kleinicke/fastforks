schema = 2
name = "DINOv2 linear"
summary = "DINOv2 (Oquab et al. 2023) linear probe: the frozen self-supervised ViT-S/B/L/14, a batch norm and a 1x1 classifier on the last block's patch tokens; the authors' ADE20K `linear` heads, sliding-window inference."
tier = "stable"
outputs = ["logits"]
uses = ["depth_anything_v2", "seginfer"]  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/facebookresearch/dinov2"
commit = "7764ea0f912e53c92e82eb78a2a1631e92725fc8"

[licence]
code = "Apache-2.0"  # facebookresearch/dinov2; the ViT comes from fastforks.shared.depth_anything_v2 (DINOv2 layers, Apache-2.0)
weights = "Apache-2.0"  # backbones and heads: the repository's README / LICENSE (Apache-2.0 since 2023-08)
files = []  # no vendored code in this family: the ViT is the shared module's, the head is two folded tensors
training_data = ["lvd-142m", "ade20k"]
evidence = "https://github.com/facebookresearch/dinov2/blob/7764ea0f912e53c92e82eb78a2a1631e92725fc8/README.md#L660"

[io]
# Size: any H x W >= 1 (default min_size = 1; 1x1 and 7x9 inputs run on CPU). The image is first resized to the family's test-time scale (`resize`), then padded or window-split by the network, so tiny inputs are upscaled and the result is resampled back.
input = "imagenet"
pad = "none"

[params]
resize = ["mmseg", 99999999, 512]  # keep-ratio resize, shorter side to 512 (the config's test img_scale)
crop = 512  # mmseg slide_inference crop and stride (test_cfg); each crop zero-padded to a multiple of 14 centred
stride = 341

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fastbb", "seg_up"]

[output]
label_set = "ade20k-150"

# Not added: ViT-g/14 (its SwiGLU FFN is not supported by the fast ViT path) and the `ms` (multi-scale, 4-layer)
# and `m2f` heads.

[[papers]]
title = "DINOv2: Learning Robust Visual Features without Supervision"
url = "https://arxiv.org/abs/2304.07193"
date = "2023-04-14"
venue = "TMLR 2024"

