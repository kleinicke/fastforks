schema = 2
name = "LingBot-Depth"
summary = "LingBot-Depth (Robbyant, 2026): metric depth completion from an image and an incomplete or noisy metric depth map (RGB-D); a DINOv2 ViT-L that attends over image and depth tokens, with MoGe's conv neck and depth / mask heads."
tier = "experimental"
outputs = ["depth", "mask"]  # mask: upstream's validity mask (upstream sets the depth outside it to inf; here it is kept)
uses = ["depth_anything_v2"]  # fastforks.shared modules this family imports (the ViT)
limitations = [
  "The depth map is required: call the model with `prompt_depth=` a metric map in metres (any size, holes as 0 / NaN / inf). Its holes change the ViT's token count, so the kernels mode runs the ViT per image. Export keeps every depth token (masked) and has a fixed size.",
]

[output]
kind = "metric"  # metres, in the scale of the depth input

[upstream]
repo = "https://github.com/robbyant/lingbot-depth"
commit = "f3a237e"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Large-scale real and synthetic RGB-D data with masked depth modelling per the tech report"
evidence = "https://github.com/robbyant/lingbot-depth/blob/main/LICENSE and the Hugging Face model cards (license: apache-2.0)"

[io]
input = "imagenet"  # the runner resizes (bilinear, antialiased, to ~1200-3600 ViT tokens at the input's aspect ratio) and normalises
pad = "none"

[options]
resolution_level = { default = 9, min = 0, max = 9 }  # 0-9: 1200-3600 ViT tokens (original infer's resolution_level)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fastbb", "dpt_fused"]

[[variants]]
id = "lingbot-depth"
revision = 1
params = { exp_output = false }
weights = [{ name = "lingbot-depth-pretrain-vitl-14-v0.5/model.pt", size = 1284837952, sha256 = "b60cf27ddbd0e51e9b59b03475c0d39d02d2e48ecf8dbb5866f04d46802b3c23", url = "https://huggingface.co/robbyant/lingbot-depth-pretrain-vitl-14-v0.5/resolve/79204ed6b837f4fdd192cf563e59481fecfa0295/model.pt" }]

[[variants]]
id = "lingbot-depth-dc"
revision = 1
params = { exp_output = true }
weights = [{ name = "lingbot-depth-postrain-dc-vitl14/model.pt", size = 1284841739, sha256 = "3a4512e05445857d1404fc00227285bd8fa4abdd97250dc65f9636aa9cc71325", url = "https://huggingface.co/robbyant/lingbot-depth-postrain-dc-vitl14/resolve/d1b06f7538d4b56387412799c528542c795df169/model.pt" }]
