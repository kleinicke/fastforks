schema = 2
name = "Depth Anything 3"
summary = "Depth Anything 3 (Lin et al. 2025, ByteDance): monocular depth from a DINOv2 ViT with DPT heads; relative (Mono), metric (Metric), any-view depth with camera (Large, Giant) and Giant aligned to Metric (Nested)."
tier = "experimental"
outputs = ["depth", "confidence", "intrinsics", "mask", "sky"]  # union; each variant lists its own
uses = ["depth_anything_v2", "quantile"]  # fastforks.shared modules this family imports

licence_notes = [
  "The Mono and Metric weights are Apache-2.0 but their training data terms are unchecked (a note only); the other variants' weights are CC-BY-NC-4.0 (`no`).",
]

[output]
kind = "metric"  # each variant sets its own

[upstream]
repo = "https://github.com/ByteDance-Seed/Depth-Anything-3"
commit = "3d835ec"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # Mono / Metric; the others override below
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Public academic datasets only (model cards); teacher-student training on synthetic and real multi-view data per the paper"
evidence = "https://github.com/ByteDance-Seed/Depth-Anything-3/blob/main/README.md (Model Cards table) and the Hugging Face model cards (DA3-LARGE-1.1's card says Apache 2.0, the repository table CC BY-NC 4.0; the table is recorded)"

[io]
input = "imagenet"  # the runner resizes (OpenCV cubic / area, longer side to long_side, multiple of 14) and normalises
pad = "none"

[options]
long_side = { default = 504, min = 14, aliases = ["process_res"] }  # longer side of the network input (original inference's process_res)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fastbb", "dpt_fused"]

[[variants]]
id = "da3mono-large"
revision = 1
params = { arch = "mono" }
outputs = ["depth", "mask", "sky"]
output = { kind = "affine_invariant" }
weights = [{ name = "DA3MONO-LARGE/model.safetensors", size = 1336734448, sha256 = "7a799a7f95eb8d4c404c2ca8be3dc3276b350a417ddc4420db72ba850cc0e960", url = "https://huggingface.co/depth-anything/DA3MONO-LARGE/resolve/f465978e618db8cc79c83b8bbf24964857db1875/model.safetensors" }]

[[variants]]
id = "da3metric-large"
revision = 1
params = { arch = "metric" }
outputs = ["depth", "intrinsics", "mask", "sky"]
output = { kind = "metric" }
weights = [{ name = "DA3METRIC-LARGE/model.safetensors", size = 1336734448, sha256 = "bbea5b0b3ee389849cffa7ddae89de064a90abd2b055fc5aa99aac68db324776", url = "https://huggingface.co/depth-anything/DA3METRIC-LARGE/resolve/4010e39f3634a45bc60553321fb49fb760bd594e/model.safetensors" }]

[[variants]]
id = "da3-large-1.1"
revision = 1
params = { arch = "large" }
outputs = ["depth", "confidence", "intrinsics"]
output = { kind = "scale_invariant" }
licence = { weights = "CC-BY-NC-4.0" }
weights = [{ name = "DA3-LARGE-1.1/model.safetensors", size = 1643843860, sha256 = "739905c423cf0d6ccaf9e61a8401d82ba1ac32d7f4d3ee6dca8f92b377633f64", url = "https://huggingface.co/depth-anything/DA3-LARGE-1.1/resolve/0e109ae307c5982f319a67cf6f9f99ccdc0ec97c/model.safetensors" }]

[[variants]]
id = "da3-giant-1.1"
revision = 1
params = { arch = "giant" }
outputs = ["depth", "confidence", "intrinsics"]
output = { kind = "scale_invariant" }
licence = { weights = "CC-BY-NC-4.0" }
weights = [{ name = "DA3-GIANT-1.1/model.safetensors", size = 5422814644, sha256 = "1e47a08338ca73a6d6a21d37fd060b26b993b672bc6ddf6295fe474df2592001", url = "https://huggingface.co/depth-anything/DA3-GIANT-1.1/resolve/72ee9f89ce4e50d704e9d55ee9c646ec8dc25a19/model.safetensors" }]

[[variants]]
id = "da3nested-giant-large-1.1"
revision = 1
params = { arch = "nested" }
