  { name = "vae/diffusion_pytorch_model.fp16.safetensors", size = 167335342, sha256 = "3e4c08995484ee61270175e9e7a072b66a6e4eeb5f0c266667fe1f45b90daf9a", url = "https://huggingface.co/Stable-X/yoso-normal-v0-3/resolve/2202fcb69960d94b437e06c19c556a12ceeb57c0/vae/diffusion_pytorch_model.fp16.safetensors" },
  { name = "text_encoder/model.fp16.safetensors", size = 680820392, sha256 = "bc1827c465450322616f06dea41596eac7d493f4e95904dcb51f0fc745c4e13f", url = "https://huggingface.co/Stable-X/yoso-normal-v0-3/resolve/2202fcb69960d94b437e06c19c556a12ceeb57c0/text_encoder/model.fp16.safetensors" },
