  { name = "pointditb-512-mixdata-nodinov3-1d42aacf.pth", size = 1097860526, sha256 = "1d42aacfd6aaf97c8bd96b0ce5e23bd880cd01b2efbb2ac80ccf8876fde3034b", url = "https://huggingface.co/haofeixu/pointdit/resolve/956a6f4279c20b59adfc1ea2038603514f4fe5dc/pointditb-512-mixdata-nodinov3-1d42aacf.pth" },
