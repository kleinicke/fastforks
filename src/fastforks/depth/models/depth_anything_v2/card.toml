schema = 2
name = "Depth Anything V2"
summary = "Depth Anything V2 (Yang et al. 2024): relative monocular depth from a DINOv2 ViT encoder and a DPT head, trained on synthetic labels and 62M pseudo-labelled real images; with the authors' metric fine-tunes (Hypersim indoor, Virtual KITTI 2 outdoor) and the Distill-Any-Depth checkpoints (He et al. 2025) of the same network."
tier = "stable"
outputs = ["inverse_depth", "depth"]  # union; each variant lists its own
uses = ["depth_anything_v2"]  # fastforks.shared modules this family imports

licence_notes = [
  "Only the Small weights are Apache-2.0; the Base and Large weights are CC-BY-NC-4.0. The training data of even the Small model has unclear commercial terms (a note only).",
  "The six metric checkpoints are Apache-2.0 on their Hugging Face cards, but the Base / Large ones are fine-tuned from the CC-BY-NC-4.0 relative Base / Large weights, and Virtual KITTI 2 (the outdoor fine-tune) is CC BY-NC-SA 3.0, Hypersim CC BY-SA 3.0.",
  "Distill-Any-Depth: Apache-2.0 on the Hugging Face card (the authors' transformers ports say MIT, the code is MIT). The paper initialises the Large model from the CC-BY-NC-4.0 Depth Anything V2 Large weights; its teachers include Depth Anything V2 and it trains on unlabeled SA-1B images (research licence).",
]
limitations = [
  "Metric checkpoints predict at most max_depth (20 m Hypersim, 80 m Virtual KITTI 2): the head is a sigmoid scaled by it. Each was fine-tuned on one synthetic domain, so indoor / outdoor scenes outside it get a wrong scale.",
  "Distill-Any-Depth runs with this family's pipeline (short side 518, aspect kept, as the authors' transformers ports); the authors' demo squashes to 700 x 700. Their Dav2-Teacher-Large-2w-iter checkpoint is not included.",
]

[output]
kind = "affine_invariant_inverse"  # relative disparity: true inverse depth up to an unknown scale and shift

[upstream]
repo = "https://github.com/DepthAnything/Depth-Anything-V2"
commit = "a561b84"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"  # Small; Base / Large override below
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Teacher (ViT-G) on 595K synthetic images (BlendedMVS, Hypersim, IRS, TartanAir, VKITTI 2); students on 62M pseudo-labelled real images (SA-1B, Open Images, BDD100K, Google Landmarks, ImageNet-21K, LSUN, Objects365, Places365) per the paper"
evidence = "https://github.com/DepthAnything/Depth-Anything-V2/blob/main/README.md (LICENSE section) and the Hugging Face model cards"

[io]
input = "imagenet"  # the runner resizes (shorter side to short_side, multiple of 14, bicubic) and normalises itself
pad = "none"

[options]
short_side = { default = 518, min = 14, aliases = ["input_size"] }  # lower bound of the resized sides (original infer_image's input_size)

[params]
max_depth = 0.0  # relative (ReLU head); metric variants set the sigmoid head's scale in metres
layout = "dav2"  # checkpoint keys; "dam": Distill-Any-Depth Large's DepthAnything layout

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fastbb", "dpt_fused"]

[[papers]]
title = "Depth Anything V2"
url = "https://arxiv.org/abs/2406.09414"
date = "2024-06-13"
venue = "NeurIPS 2024"
variants = ["depth-anything-v2-s", "depth-anything-v2-b", "depth-anything-v2-l", "depth-anything-v2-metric-hypersim-s", "depth-anything-v2-metric-hypersim-b", "depth-anything-v2-metric-hypersim-l", "depth-anything-v2-metric-vkitti-s", "depth-anything-v2-metric-vkitti-b", "depth-anything-v2-metric-vkitti-l"]

[[papers]]
title = "Distill Any Depth: Distillation Creates a Stronger Monocular Depth Estimator"
url = "https://arxiv.org/abs/2502.19204"
date = "2025-02-26"
venue = "arXiv"
variants = ["distill-any-depth-s", "distill-any-depth-b", "distill-any-depth-l"]

