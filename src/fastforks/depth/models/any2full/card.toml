schema = 2
name = "Any2Full"
summary = "Any2Full (2026): one-stage depth completion that prompts Depth Anything V2 with a sparse depth map of any pattern and density; the depth tokens modulate the ViT features entering the DPT head, the disparity is fitted to the prompt."
tier = "experimental"
outputs = ["depth"]
uses = ["depth_anything_v2"]  # fastforks.shared modules this family imports (the ViT, the DPT head)
limitations = [
  "The depth map is required: call the model with `prompt_depth=` a metric map in metres (any size, sparse points or holes as 0 / NaN / inf). The output is fitted to it by scale and shift in disparity, so it needs at least two distinct valid values.",
  "Export has a fixed input size.",
]

[output]
kind = "metric"  # metres, in the scale of the depth input

[upstream]
repo = "https://github.com/zhiyuandaily/Any2Full"
commit = "780edf6"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Training data and code not released yet (arXiv 2603.05711); the ViT and head start from Depth Anything V2"
evidence = "https://github.com/zhiyuandaily/Any2Full/blob/main/LICENSE and the Hugging Face model card zhiyuandaily/Any2Full (license: apache-2.0)"

[io]
input = "imagenet"  # the runner resizes (bicubic, the shorter side to at least short_side, both sides up to a multiple of 14) and normalises
pad = "none"

[options]
short_side = { default = 518, min = 14 }  # the shorter network side is at least this (upstream resize_lower_size)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["fastbb", "dpt_fused"]

[[papers]]
title = "Any to Full: Prompting Depth Anything for Depth Completion in One Stage"
url = "https://arxiv.org/abs/2603.05711"
date = "2026-03-05"
venue = "ECCV 2026"

