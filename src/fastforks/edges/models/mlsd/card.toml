schema = 2
name = "M-LSD line segments"
summary = "Mobile line segment detector (Gu et al., AAAI 2022; controlnet_aux `MLSDdetector`, ComfyUI's \"M-LSD Lines\"): a MobileNetV2 network that predicts segment centers and end-point displacements; returns the straight segments and the 1-pixel line map ControlNet's MLSD model takes."
tier = "experimental"
outputs = ["edges", "lines"]
uses = []  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/controlnet_aux"
commit = "b1aac318b15c4e65a21bc516dc236ad4bf593d46"  # net/ = src/controlnet_aux/mlsd/models/mbv2_mlsd_large.py; the call is MLSDdetector.__call__ + mlsd/utils.py pred_lines

[licence]
code = "Apache-2.0"  # src/controlnet_aux/mlsd/LICENSE (lhwcv/mlsd_pytorch's PyTorch port of navervision/mlsd, both Apache-2.0)
weights = "Apache-2.0"  # mlsd_large_512_fp32.pth is a file of the Apache-2.0 lhwcv/mlsd_pytorch repository (byte-identical to lllyasviel/Annotators')
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Not stated for this checkpoint; the M-LSD paper trains on the Wireframe dataset (Huang et al. 2018, no licence stated)."
evidence = "https://github.com/lhwcv/mlsd_pytorch/blob/2312205254e66911703decf775f626995d260f17/LICENSE ; https://github.com/lhwcv/mlsd_pytorch/tree/2312205254e66911703decf775f626995d260f17/models"

[io]
input = "0-1"  # the runner resizes to the detect size (OpenCV area / cubic on uint8 levels)

[options]
resolution = { default = 512, min = 64, aliases = ["detect_resolution"] }  # detect resolution: the network input's short side, sides rounded to a multiple of 64 (controlnet_aux detect_resolution)
thr_v = { default = 0.1, min = 0.0, max = 1.0 }  # center score threshold (kept if above; controlnet_aux thr_v)
thr_d = { default = 0.1, min = 0.0 }  # segment length threshold in half-resolution pixels (kept if above; controlnet_aux thr_d)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "a MobileNetV2 CNN (cuDNN); decoding is a few small ops; no custom kernel measured to pay off"

[[papers]]
title = "Towards Light-weight and Real-time Line Segment Detection"
url = "https://arxiv.org/abs/2106.00186"
date = "2021-06-01"
venue = "AAAI 2022"

[[variants]]
id = "mlsd"
revision = 1
weights = [{ name = "mlsd_large_512_fp32.pth", size = 6341481, sha256 = "5696f168eb2c30d4374bbfd45436f7415bb4d88da29bea97eea0101520fba082", url = "https://raw.githubusercontent.com/lhwcv/mlsd_pytorch/2312205254e66911703decf775f626995d260f17/models/mlsd_large_512_fp32.pth" }]
