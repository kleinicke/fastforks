# Golden outputs of this family (tests/synth.py pair, files in $FASTFORKS_GOLDEN_PATH), written by
# tools/golden/<family>.py from `upstream` (+ `patch` from tools/golden/patches/). [tolerance]: max |diff| on CPU
# float32 (`cpu_atol`), and on GPU the main output's mean |diff| and 99th percentile (disparity: px; divided by the
# reference's median |value| if `relative = true`). [validated]: kernel builds (`lib@build:target`) a GPU golden run
# passed with (`pytest -m gpu --record`). Not shipped in wheels.

[tolerance]
cpu_atol = 0.002
cpu_outliers = 0.001  # a segment whose score or length sits at a threshold, or a truncation at an integer, flips its pixels
gpu_mean = 0.02
gpu_p99 = 0.25

[refs."mlsd@1"]
sha256 = "c9401ec36bec7bdc33485951502abd8ce34624e47cb8d80e7352db503ccbf989"
upstream = "https://github.com/huggingface/controlnet_aux@b1aac318b15c4e65a21bc516dc236ad4bf593d46"
settings = "CPU float32, controlnet_aux mlsd in float (cv2 resize_image, no 8-bit rounding), resolution 512, coffee.png, torch 2.14.1+cu130"
