schema = 2
name = "Line art (informative-drawings)"
summary = "Line art preprocessor of ControlNet 1.1 (controlnet_aux `LineartDetector`, ComfyUI's \"Realistic Lineart\"): the informative-drawings generator (Chan, Durand and Isola, CVPR 2022; 3 residual blocks, instance norm) turns a photo into a line drawing. `lineart` is the realistic model, `lineart-coarse` the coarse one."
tier = "experimental"
outputs = ["edges"]
uses = []  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/controlnet_aux"
commit = "b1aac318b15c4e65a21bc516dc236ad4bf593d46"  # net/generator.py = src/controlnet_aux/lineart/__init__.py (network classes); the call is LineartDetector.__call__

[licence]
code = "MIT"  # src/controlnet_aux/lineart/LICENSE (carolineec/informative-drawings)
weights = "assumed from code"  # lllyasviel/Annotators states "license: other" and no terms; the model card is empty
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Not stated for these checkpoints (lllyasviel/Annotators, ControlNet 1.1); informative-drawings trains on unpaired photographs and line drawings."
evidence = "https://github.com/huggingface/controlnet_aux/blob/b1aac318b15c4e65a21bc516dc236ad4bf593d46/src/controlnet_aux/lineart/LICENSE ; https://huggingface.co/lllyasviel/Annotators"

[io]
input = "0-1"  # the runner resizes to the detect size (OpenCV area / cubic on uint8 levels) and divides by 255

[options]
resolution = { default = 512, min = 64, aliases = ["detect_resolution"] }  # detect resolution: the network input's short side, sides rounded to a multiple of 64 (controlnet_aux detect_resolution)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "a small conv generator: cuDNN convolutions and instance norm are the whole time; no custom kernel measured to pay off"

[[papers]]
title = "Learning to generate line drawings that convey geometry and semantics"
url = "https://arxiv.org/abs/2203.12691"
date = "2022-03-23"
venue = "CVPR 2022"

[[papers]]
title = "Adding Conditional Control to Text-to-Image Diffusion Models"
url = "https://arxiv.org/abs/2302.05543"
date = "2023-02-10"
venue = "ICCV 2023"

[[variants]]
id = "lineart"
revision = 1
weights = [{ name = "sk_model.pth", size = 17173511, sha256 = "c686ced2a666b4850b4bb6ccf0748031c3eda9f822de73a34b8979970d90f0c6", url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model.pth" }]

[[variants]]
id = "lineart-coarse"
revision = 1
weights = [{ name = "sk_model2.pth", size = 17173511, sha256 = "30a534781061f34e83bb9406b4335da4ff2616c95d22a585c1245aa8363e74e0", url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model2.pth" }]
