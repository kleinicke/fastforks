schema = 2
name = "HED soft edges (ControlNet 1.1)"
summary = "Soft edge preprocessor of ControlNet 1.1 (controlnet_aux `HEDdetector`, ComfyUI's \"HED Soft-Edge Lines\"): lllyasviel's Apache-2.0 re-implementation of holistically-nested edge detection, a VGG-style network whose five side outputs are averaged into a soft edge map (RGB input, smoother edges than the original HED)."
tier = "experimental"
outputs = ["edges"]
uses = []  # fastforks.shared modules this family imports

[upstream]
repo = "https://github.com/huggingface/controlnet_aux"
commit = "b1aac318b15c4e65a21bc516dc236ad4bf593d46"  # net/hed.py = src/controlnet_aux/hed/__init__.py (network classes); the call is HEDdetector.__call__

[licence]
code = "Apache-2.0"  # src/controlnet_aux/hed/__init__.py header: "an improved version and model of HED edge detection with Apache License, Version 2.0"; LICENSE = the repository's LICENSE.txt
weights = "Apache-2.0"  # the code header names the model too ("version and model ... with Apache License, Version 2.0. Please use this implementation in your products")
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "Not stated for these checkpoints (lllyasviel/Annotators, ControlNet 1.1); HED (Xie and Tu) trains on BSDS500; this re-trained model states no data."
evidence = "https://github.com/huggingface/controlnet_aux/blob/b1aac318b15c4e65a21bc516dc236ad4bf593d46/src/controlnet_aux/hed/__init__.py ; https://huggingface.co/lllyasviel/Annotators"

[io]
input = "0-1"  # the runner resizes to the detect size (OpenCV area / cubic on uint8 levels) and feeds 0..255

[options]
resolution = { default = 512, min = 64, aliases = ["detect_resolution"] }  # detect resolution: the network input's short side, sides rounded to a multiple of 64 (controlnet_aux detect_resolution)
safe = false  # true: quantize the map to 3 levels (controlnet_aux `safe=True`, `safe_step`)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
status = "none"
reason = "a VGG-style CNN: cuDNN convolutions are the whole time; no custom kernel measured to pay off"

[[papers]]
title = "Holistically-Nested Edge Detection"
url = "https://arxiv.org/abs/1504.06375"
date = "2015-04-24"
venue = "ICCV 2015"

[[papers]]
title = "Adding Conditional Control to Text-to-Image Diffusion Models"
url = "https://arxiv.org/abs/2302.05543"
date = "2023-02-10"
venue = "ICCV 2023"

[[variants]]
id = "hed"
revision = 1
weights = [{ name = "ControlNetHED.pth", size = 29444406, sha256 = "5ca93762ffd68a29fee1af9d495bf6aab80ae86f08905fb35472a083a4c7a8fa", url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/ControlNetHED.pth" }]
