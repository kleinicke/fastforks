schema = 2
name = "Segment Anything 2.1 (SAM 2.1)"
summary = "Segment Anything 2.1 (Ravi et al. 2024), image mode: promptable segmentation with a hierarchical Hiera image encoder, an FPN neck and the SAM prompt encoder / mask decoder with high-resolution skip features; masks from points, boxes and mask logits. `track` follows objects prompted on the first frame through a video with the original memory attention / memory encoder (`SAM2VideoPredictor`, forward, memory features in bfloat16 as upstream); the memory side has no fused kernels yet. The portable `module()` is the image encoder only."
tier = "stable"
outputs = ["pred_masks", "iou_scores"]

[upstream]
repo = "https://github.com/facebookresearch/sam2"
commit = "2b90b9f"

[licence]
code = "Apache-2.0"
weights = "Apache-2.0"
files = ["LICENSE"]
training_data = ["unstated"]
training_note = "SA-1B and the SA-V video dataset (plus internal data) per the paper; SA-V itself is under CC BY 4.0, SA-1B under its research licence"
evidence = "https://github.com/facebookresearch/sam2/blob/main/README.md (License section: model checkpoints and code under Apache 2.0)"

[io]
input = "imagenet"  # original SAM2Transforms: ToTensor (/255), Resize to image_size x image_size (bilinear, antialias), Normalize(ImageNet mean / std)

[params]
image_size = 1024  # the encoder input is resized to image_size x image_size (no aspect-ratio padding)

[modes.portable]
cuda_dtype = "float16"  # image encoder; prompt encoder / mask decoder stay float32
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["dpt_fused"]

[[variants]]
id = "sam2.1-hiera-tiny"
revision = 1
