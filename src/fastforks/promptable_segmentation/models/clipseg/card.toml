schema = 2
name = "CLIPSeg (text-prompted segmentation, CLIP B/16)"
summary = "CLIPSeg (Lüddecke and Ecker 2022): a frozen CLIP ViT-B/16 with a small transformer decoder that segments whatever a free-text prompt names; the text embedding conditions the decoder by FiLM. Semantic: one mask per prompt (all pixels of the concept), at 352 x 352, resized to the image. Pass `text=` at call time. The portable `module()` is the network on the normalised 352 x 352 image plus a projected text embedding."
tier = "experimental"
outputs = ["boxes", "scores", "masks"]  # the `ConceptSegmentationResult` fields
uses = ["seginfer", "cuda_graphs", "clip_tokenizer"]  # fastforks.shared modules this family imports
limitations = [
  "Requires the optional transformers library (the network is its `CLIPSegForImageSegmentation`).",
  "The original in the benchmarks and goldens is the Hugging Face transformers 5.19.0 port with the authors' weights (CIDAS/clipseg-rd64-refined); the authors' timojl/clipseg code was not run.",
  "Text prompts only (no box exemplars or visual prompts); one instance per prompt: its mask is every pixel above probability 0.5, its score the highest pixel probability, its box the mask's bounding box.",
  "The image is resized to 352 x 352 without keeping the aspect ratio, as the original processor; masks are coarse (22 x 22 patch tokens).",
]

[upstream]
repo = "https://github.com/huggingface/transformers"
commit = "c4c4605f961877852b89b97478536bb3a26b6fd1"  # transformers v5.19.0: the network is built by the installed library

[[upstream.official]]
repo = "https://github.com/timojl/clipseg"
framework = "PyTorch"
reason = "fastforks follows the transformers port, which loads the authors' converted weights (CIDAS/clipseg-rd64-refined) without the repo's CLIP dependency."

[licence]
code = "Apache-2.0"  # transformers; the original timojl/clipseg is MIT
weights = "Apache-2.0"  # the CIDAS/clipseg-rd64-refined model card: license apache-2.0
files = []  # no vendored code: the architecture is transformers' own module
training_data = ["phrasecut"]
training_note = "The decoder is trained on PhraseCut (extended with visual prompts in the paper; the refined rd64 checkpoint, reduce_dim 64); the CLIP towers are OpenAI's frozen ViT-B/16, trained on web image-text pairs that were not released (CLIPSeg paper, arXiv:2112.10003)."
evidence = "https://huggingface.co/CIDAS/clipseg-rd64-refined/blob/999e0328d9e10b484360c477313983f9afdd7050/README.md"

[io]
input = "mean_std"  # original CLIPSegProcessor: uint8 resize to 352 x 352 (bilinear, antialias), /255, ImageNet mean / std; the runner resizes itself
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]

[options]
cuda_graphs = { default = true, effect = "speed" }  # kernels: replay the vision tower and the decoder from CUDA graphs (false: eager, no graph pool)

[params]
arch = "CLIPSegForImageSegmentation"

[modes.portable]
cuda_dtype = "float16"  # all of the network; scores, boxes and the mask upsampling in float32
mps_dtypes = ["float32", "float16"]

[modes.kernels]
kernels = ["fvm_conv"]  # vision-tower GEMMs with fused bias / SiLU (folded QuickGELU) / residual epilogues, fp16 accumulation, CUDA graphs

[[papers]]
title = "Image Segmentation Using Text and Image Prompts"
url = "https://arxiv.org/abs/2112.10003"
date = "2021-12-18"
venue = "CVPR 2022"

