summary = "Shared parts of the super-resolution networks (SwinIR, Swin2SR, HAT, DRCT, DAT; the MLX CNNs RRDBNet, SPAN, Compact): timm-free `DropPath` / `to_2tuple` / `trunc_normal_` for the vendored nets, the shifted-window mask cached per size on the device, and window attention as one `scaled_dot_product_attention` (head size padded to a multiple of 8 on CUDA) with the relative position bias computed once; the hand-written MLX ports' blocks, 3 x 3 convs (Winograd in kernels mode) and row-banded tails."
