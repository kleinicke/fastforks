# Golden outputs of this family (tests/synth.py pair, files in $FASTFORKS_GOLDEN_PATH), written by
# tools/golden/<family>.py from `upstream` (+ `patch` from tools/golden/patches/). [tolerance]: max |diff| on CPU
# float32 (`cpu_atol`), and on GPU the main output's mean |diff| and 99th percentile (disparity: px; divided by the
# reference's median |value| if `relative = true`). [validated]: kernel builds (`lib@build:target`) a GPU golden run
# passed with (`pytest -m gpu --record`). Not shipped in wheels.

[tolerance]
# sparse: share of golden keypoints with a fastforks keypoint within 1 px (recall), share of matches found in both
# (match), max |score diff| over those (cpu_atol), GPU mean / p99 keypoint distance (px)
# CPU measured: recall, match 1.0; keypoints within 4.3e-5 px, scores identical (floors as xfeat)
# GPU float16 measured: recall / match 0.9986 (indoor) and 0.9994 (outdoor), mean 1.3e-3 / 1.8e-3 px, p99 6.8e-3 / 0.0128 px
cpu_atol = 3.0e-5
cpu_min_recall = 0.99
cpu_min_match = 0.99
gpu_mean = 2.5e-3
gpu_p99 = 0.02
gpu_min_recall = 0.998
gpu_min_match = 0.998

