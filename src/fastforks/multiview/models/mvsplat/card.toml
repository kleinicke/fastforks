schema = 2
name = "MVSplat"
summary = "MVSplat (Chen et al. 2024): feed-forward 3D Gaussian splatting and depth from posed, calibrated images. A UniMatch CNN and multi-view swin transformer feed a plane-sweep cost volume (all other views), refined by 2D U-Nets with cross-view attention into every view's depth; a Gaussian head predicts one Gaussian per pixel (opacity, scale, rotation, degree-4 SH) in the given world frame (`result.gaussians`, `.save(\"scene.ply\")`). Forward pass only: no renderer."
tier = "experimental"
outputs = ["depth", "confidence", "gaussians"]  # confidence: largest probability over the depth candidates; gaussians: MultiViewResult.gaussians (not a map)

licence_notes = [
  "Only the RealEstate10K checkpoint is shipped (MIT code and weights); the ACID checkpoint has the same architecture.",
]

[output]
kind = "metric"  # in the units of the given cam_to_world and depth_range (scaled internally to near = 1, the training bounds; the network is not scale invariant)

[upstream]
repo = "https://github.com/donydchen/mvsplat"
commit = "01f9a28"

[licence]
code = "MIT"  # LICENSE (Yuedong Chen)
weights = "MIT"  # the repository licence covers the released checkpoints (README: pretrained models)
files = ["LICENSE"]
training_data = ["realestate10k"]
training_note = "RealEstate10K (YouTube videos, camera poses from ORB-SLAM; research use per its release), the backbone initialised from UniMatch (GMDepth, ScanNet)."
evidence = "https://github.com/donydchen/mvsplat/blob/01f9a28edb5eb68416e7e63b01f8d90c3bdfbf01/LICENSE and https://github.com/donydchen/mvsplat/blob/01f9a28edb5eb68416e7e63b01f8d90c3bdfbf01/README.md and https://drive.google.com/drive/folders/14_E_5R6ojOWnLSrSVLVEMHnTiKsfddjU"

[io]
input = "0-1"  # the runner resizes (long side long_side, multiples of 16, bicubic antialiased; upstream: 256 x 256 crops)
pad = "none"

[options]
long_side = { default = 256, min = 16 }  # network long side (the checkpoint was trained at 256 x 256)

[modes.portable]
cuda_dtype = "float16"
mps_dtypes = ["float32"]

[modes.kernels]
kernels = ["cudnn_hacc"]

[[variants]]
id = "mvsplat-re10k"
revision = 1
weights = [{ name = "re10k.ckpt", size = 48019233, sha256 = "83d0d9eaa753fa4a1f925288dc1f90b8c3297fad0ab0f6ed1f11a1c5946da25a", url = "https://drive.usercontent.google.com/download?id=1Y5OAJN9AX5yMjkbyxag5OnwacdjPnl-N&export=download&confirm=t" }]
