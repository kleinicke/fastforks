# Golden outputs of this family (tests/synth.py pair, files in $FASTFORKS_GOLDEN_PATH), written by
# tools/golden/<family>.py from `upstream` (+ `patch` from tools/golden/patches/). [tolerance]: max |diff| on CPU
# float32 (`cpu_atol`), and on GPU the main output's mean |diff| and 99th percentile (disparity: px; divided by the
# reference's median |value| if `relative = true`). [validated]: kernel builds (`lib@build:target`) a GPU golden run
# passed with (`pytest -m gpu --record`). Not shipped in wheels.

[tolerance]
cpu_atol = 5e-05
# float rounding (1e-6 in depth) flips a few kNN neighbours of the point transformers; the multi-view attention and the
# render-and-compare refinement spread that to every Gaussian: mean |diff| ~1e-5, 0.7-1.5 % beyond 1e-3 (CPU vs CPU),
# and rotations with w ~ 0 may flip sign (q = -q)
cpu_extra = [["gaussians.means", 0.001], ["gaussians.scales", 0.001], ["gaussians.rotations", 0.001], ["gaussians.harmonics", 0.001], ["gaussians.opacities", 0.001]]
cpu_outliers = 0.02
gpu_mean = 0.01
gpu_p99 = 0.05

