name: Publish to PyPI
# Manual: builds fastforks, fastforks-core and the dists.toml distributions, then uploads each via trusted publishing.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-default-groups --group cpu
      - run: uv run --frozen python tools/build_dists.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    # one environment per project: PyPI accepts a pending trusted publisher config for one project only
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { wheel: fastforks-, environment: pypi }
          - { wheel: fastforks_core-, environment: pypi-core }
          - { wheel: fastforks_nc-, environment: pypi-nc }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: all/
      - run: mkdir dist && mv all/${{ matrix.wheel }}*.whl dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
