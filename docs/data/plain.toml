efficientformerv2 = "EfficientFormerV2 (Li et al. 2022, Snap Research; S0, S1, S2, L; distilled on ImageNet-1k): a mobile hybrid of convolutions and attention. Apache-2.0."
coatnet = "CoAtNet (Dai et al. 2021; timm's `rw` networks nano to 2, ImageNet-1k, some pretrained on ImageNet-12k): convolution stages followed by attention stages. Apache-2.0."
efficientformer = "EfficientFormer (Li et al. 2022, Snap Research; L1, L3, L7; distilled on ImageNet-1k): a hybrid of pooling blocks and transformer blocks built for phone latency. Apache-2.0."
focalnet = "FocalNet (Yang et al. 2022; tiny, small and base with small or large receptive field, ImageNet-1k): a classifier with focal modulation instead of attention. MIT."
