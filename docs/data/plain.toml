convnext = "Meta's ConvNeXt (Liu et al. 2022; tiny, small, base, large; ImageNet-1k, and ImageNet-22k fine-tuned at 224 and 384): a convolutional classifier of 7x7 depthwise convolutions, LayerNorm and MLP blocks. Apache-2.0."
