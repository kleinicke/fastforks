# Plain-language one-liners per model family for the generated model pages (tools/gen_docs.py).
# Facts only, each from the family's card.toml, its LICENSE or the page's own tables: what it is for, who made it
# (only where the card or the vendored LICENSE names them), the licence in plain words. No speed or ranking claims.
# "commercially usable" needs every variant of the family to be commercial yes, "non-commercial" at least one no
# (tests/test_docs.py).

# --- stereo
aanet = "A stereo network that aggregates matching costs with sparse deformable sampling across scales, trained on synthetic SceneFlow data."
bridgedepth = "A stereo network that aligns Depth Anything V2 features with NMRF-style disparity proposals. Non-commercial weights."
c_foundationstereo = "NVIDIA's releases of FoundationStereo for commercial use, including a distilled fast variant. The licence differs by variant, see the table."
cas_gwcnet = "Alibaba's cascade version of GwcNet: two cost-volume stages, the second narrowed around the first disparity. Trained on synthetic data."
cfnet = "A stereo network with cascaded and fused cost volumes, trained on synthetic data."
coex = "A stereo network on a MobileNetV2 backbone with guided cost excitation (correlate and excite)."
crestereo = "Megvii's cascaded recurrent stereo network, trained on a wide mix of real and synthetic stereo data."
defom_stereo = "A stereo network from the Insta360 Research Team that uses Depth Anything V2 features and an initial depth prior. Non-commercial weights."
dlnr = "A stereo network in the RAFT-Stereo style with a decoupled LSTM and normalization refinement."
fast_acvnet = "A stereo network by Gangwei Xu et al. that uses attention-selected disparities and a MobileNetV2 backbone, in a base and a plus version."
foundationstereo = "NVIDIA's zero-shot stereo foundation model. Non-commercial weights."
great_igev = "IGEV-Stereo extended with global attention (spatial, epipolar-row and volume attention)."
gwcnet = "A classic stereo network by Xiaoyang Guo et al. that builds a group-wise correlation cost volume."
hitnet = "Google Research's tile-based stereo model; the authors' ETH3D and Middlebury versions, ported to PyTorch."
igev_plusplus = "The successor of IGEV-Stereo by Gangwei Xu et al., with multi-range geometry encoding volumes for large disparity ranges."
igev_stereo = "An iterative stereo network by Gangwei Xu et al. (geometry encoding volume with ConvGRU updates), with several fine-tuned checkpoints."
las2 = "LiteAnyStereo V2, an efficient zero-shot stereo family in sizes S, M, L and H."
mocha_stereo = "A stereo network by Ziyang Chen et al. that adds motif channel attention to an IGEV-style volume."
monster = "A stereo network that combines Depth Anything V2 mono depth with stereo matching. Non-commercial licence."
monster_plusplus = "The accuracy model of MonSter++, which combines mono depth and stereo matching; Autel Robotics and Huazhong University of Science and Technology. Non-commercial licence."
nmrf = "A stereo network from the CUHK T-Stone Robotics Institute that treats matching as Markov random field inference."
psmnet = "A classic stereo network by Jia-Ren Chang with a spatial-pyramid backbone and stacked 3D hourglasses."
raft_stereo = "A recurrent stereo network from the Princeton Vision & Learning Lab, with checkpoints for several datasets."
rt_monster_plusplus = "The real-time version of MonSter++ (Autel Robotics and Huazhong University of Science and Technology), using a small mono depth model. Non-commercial licence."
s2m2 = "A transformer-based stereo family in four sizes (S, M, L, XL). Non-commercial licence."
selective_igev = "IGEV-Stereo with selective recurrent units, by Xianqi Wang et al., with checkpoints for several datasets."
waft_stereo = "A stereo network from the Princeton Vision & Learning Lab that warps features instead of building a cost volume, in sizes S and B. The licence differs by size, see the table."

# --- depth
depth_anything_3 = "ByteDance's Depth Anything 3: depth from one image, with relative, metric and multi-view versions. The licence differs by variant, see the table."
depth_anything_v2 = "Depth Anything V2: relative depth from one image, in small, base and large. The licence differs by size, see the table."
depth_pro = "Apple's single-image model for metric depth and the camera focal length, at 1536x1536 internal resolution. Research-only licence."
marigold = "Marigold from ETH Zurich (PRS): depth from one image by diffusion on a Stable Diffusion UNet. Commercially usable under an OpenRAIL licence."
metric3d = "Metric3D v2 (Wei Yin and Mu Hu et al.): metric depth and surface normals from one image, given the focal length. Commercially usable; the authors ask commercial users to contact them."
midas = "MiDaS v3.1 from Intel ISL, with a BEiT-L encoder: relative depth from one image."
moge = "Microsoft's MoGe: depth, 3D points, normals and focal length from one image."
unidepth_v2 = "UniDepth V2: metric depth from one image without known camera data. Non-commercial licence."
unik3d = "UniK3D: metric 3D from one image for any camera type, using a spherical-harmonic ray model. Non-commercial licence."
zoedepth = "ZoeDepth from the Intelligent Systems Lab: metric depth from one image, for indoor and outdoor scenes."

