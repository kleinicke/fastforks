convnextv2 = "ConvNeXt V2 (Woo et al. 2023): a convolutional classifier with global response normalisation. Non-commercial weights."
deit = "DeiT (Touvron et al. 2021): a vision transformer trained on ImageNet-1k only."
densenet = "DenseNet (Huang et al. 2016): a classifier with densely connected convolution blocks."
dinov2_linear_cls = "DINOv2 ViT-L/14 (Oquab et al. 2023) with its official linear ImageNet head."
efficientnet = "EfficientNet (Tan and Le 2019): compound-scaled classifiers of different sizes."
efficientnetv2 = "EfficientNetV2 (Tan and Le 2021): the follow-up to EfficientNet with fused-MBConv early stages."
efficientvit = "EfficientViT (Cai et al. 2023, MIT Han lab): a classifier with multi-scale linear attention."
eva02 = "EVA-02 (Fang et al. 2023): a vision transformer pre-trained with masked image modelling."
fastvit = "FastViT (Vasu et al. 2023): a hybrid classifier with reparameterisable token mixing."
inception_v3 = "Inception-v3 (Szegedy et al. 2015): a classic classifier with factorised inception modules; takes 299 px input."
mobilenetv1 = "MobileNet V1 (Howard et al. 2017): a classifier built on depthwise-separable convolutions."
mobilenetv2 = "MobileNetV2 (Sandler et al. 2018): a classifier built on inverted residuals."
mobilenetv3 = "MobileNetV3 (Howard et al. 2019): a classifier found by architecture search, with squeeze-excite and hard-swish."
mobilenetv4 = "MobileNetV4 (Qin et al. 2024): a classifier built on universal inverted bottlenecks."
regnet = "RegNetY (Radosavovic et al. 2020): classifiers from a designed family of residual stages."
resnet = "ResNet (He et al. 2015): the standard residual classifier."
shufflenetv2 = "ShuffleNet V2 (Ma et al. 2018): a classifier built on channel split and shuffle units."
siglip = "SigLIP So400m/14 (Zhai et al. 2023) fine-tuned on ImageNet-1k."
squeezenet = "SqueezeNet 1.1 (Iandola et al. 2016): a classifier built from fire modules."
swin = "Swin Transformer (Liu et al. 2021): a vision transformer with shifted-window attention."
vgg = "VGG (Simonyan and Zisserman 2014): a classifier of stacked 3x3 convolutions."
vit = "Vision Transformer (Dosovitskiy et al. 2020): a transformer classifier on 16x16 image patches."

# --- segmentation
mmseg = "The MMSegmentation authors' ADE20K checkpoints of FCN, PSPNet, DeepLabV3, DeepLabV3+ and HRNet, convolutional scene segmentation."
dinov2_linear = "Meta's DINOv2 features with a linear layer on top for ADE20K scene segmentation."
eomt = "EoMT: a plain vision transformer that also predicts masks, for ADE20K scene segmentation, with DINOv2 or DINOv3 pre-training."
mask2former = "Mask2Former with a Swin-L backbone for ADE20K scene segmentation. Non-commercial weights."
oneformer = "OneFormer (SHI Labs): one network for several segmentation tasks, used here for ADE20K scene segmentation."
sapiens = "Meta's Sapiens: segmentation of human body parts (28 Goliath classes such as face, hair, limbs and clothing). Non-commercial licence."
segformer = "NVIDIA's SegFormer: a transformer for ADE20K scene segmentation, sizes B0 and B5. Non-commercial weights."

# --- promptable segmentation
sam = "Segment Anything: masks from clicks, boxes or mask prompts, in sizes B, L and H."
sam2 = "Segment Anything 2.1 in image mode: masks from clicks, boxes or mask prompts, in four sizes."
sam3 = "Segment Anything 3: masks for every object that matches a text or example prompt, as well as clicks and boxes. Meta's SAM License applies; commercially usable under it."

# --- detection
rcnn = "Faster R-CNN and Mask R-CNN from the detectron2 model zoo (ResNet-50 FPN, COCO): boxes, classes and, for Mask R-CNN, instance masks."
detr = "DETR (ResNet-50 and ResNet-101, COCO) from Facebook Research: end-to-end boxes and classes from 100 object queries, no NMS."
rtdetrv2 = "RT-DETRv2 (S, M, M*, L, X; ResNet-vd, COCO) from the RT-DETR authors: real-time end-to-end detector, 300 queries and deformable attention, no NMS."
dfine = "D-FINE (N, S, M, L, X; HGNetV2, COCO) from USTC: real-time end-to-end detector in the RT-DETR style, 300 queries, deformable attention and box edges refined as distributions, no NMS."

# --- features
dinov2 = "Meta's DINOv2: self-supervised image features (patch and class tokens) in four sizes, with and without register tokens."
dinov3_convnext = "Meta's DINOv3 distilled into ConvNeXt backbones (T, S, B, L): image features. Needs the gated DINOv3 licence."
dinov3 = "Meta's DINOv3 vision transformers: self-supervised image features with register tokens and RoPE. Needs the gated DINOv3 licence."

# --- multiview
mapanything = "MapAnything (Meta): metric 3D reconstruction (cameras and depth) from several unposed images in one pass. Commercially usable (Apache variant)."
mvsanywhere = "MVSAnywhere (Niantic): depth of a reference view from several posed images, for any scene type. Non-commercial licence."
patchmatchnet = "PatchmatchNet by Fangjinhua Wang et al.: learned PatchMatch multi-view stereo, depth from posed images."
vggt = "VGGT (Meta): cameras, depth and 3D points for many images in one pass. Non-commercial weights."
vggt_omega = "VGGT-Omega (Meta): the successor of VGGT with a DINOv3 backbone, cameras and depth from many images. Non-commercial licence."
