efficientvit = "EfficientViT (Cai et al. 2023, MIT Han lab): a classifier with multi-scale linear attention."
eva02 = "EVA-02 (Fang et al. 2023): a vision transformer pre-trained with masked image modelling."
fastvit = "FastViT (Vasu et al. 2023): a hybrid classifier with reparameterisable token mixing."
