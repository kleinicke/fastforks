# --- interpolation
rife = "RIFE (Practical-RIFE 4.25, 4.26 and 4.25 lite, Huang et al.): makes the frame between two video frames from the optical flow it estimates between them, for slow motion and higher frame rates. MIT code and weights."

# --- restoration
realesrgan = "Real-ESRGAN (Wang et al., Tencent ARC, 2021): upscales real-world photos (x4, x2) and anime images (x4) with an RRDB network trained on synthetic degradations (blur, noise, JPEG); the classic ComfyUI upscaler. BSD-3-Clause code and weights."
span = "SPAN (Wan et al., NTIRE 2024 efficient SR winner): a small, fast x4 / x2 upscaler for clean (bicubic) images, convolutions with parameter-free attention. Apache-2.0 code and weights."
codeformer = "CodeFormer (Zhou et al., S-Lab NTU, NeurIPS 2022): restores a degraded face (an aligned 512 x 512 crop) by predicting codes of a learned face codebook; fidelity w trades quality against faithfulness. Non-commercial code and weights (S-Lab License 1.0)."
gfpgan = "GFPGAN v1.4 (Wang et al., Tencent ARC, CVPR 2021): restores a degraded face (an aligned 512 x 512 crop) with a pretrained StyleGAN2 face generator as prior; the classic face restorer of upscaling tools. Apache-2.0 code and weights."
compact = "Real-ESRGAN Compact (Wang et al., Tencent ARC): a small, fast VGG-style x4 upscaler for real-world photos (`realesr-general-x4v3`); also loads other Compact checkpoints. BSD-3-Clause code and weights."
realplksr = "RealPLKSR (neosr, after PLKSR by Lee et al., 2024): a large-kernel CNN upscaler; `realplksr-nomoswebphoto-x4` is Philip Hofmann's x4 model for noisy, blurred and JPEG / WebP-compressed photos; also loads other RealPLKSR checkpoints. Apache-2.0 code, CC-BY-4.0 weights."
dat = "DAT (Chen et al., ICCV 2023): a x4 upscaler for clean (bicubic) images that alternates spatial and channel attention, in three sizes (DAT, DAT-2, DAT-light). Apache-2.0 code and weights."
hat = "HAT (Chen et al., CVPR 2023): a x4 upscaler mixing window attention, channel attention and overlapping cross-attention: two models for clean (bicubic) images (large and small) and a GAN model for real-world photos. Apache-2.0 code and weights."
swinir = "SwinIR (Liang et al., ICCVW 2021): a Swin Transformer upscaler: x4 / x2 for clean (bicubic) images and x4 for real-world photos (medium and large). Apache-2.0 code and weights."
lama = "LaMa big-lama (Suvorov et al., Samsung AI, WACV 2022): fills the masked hole of an image (object removal) with a fast-Fourier-convolution network trained on scene photos. Apache-2.0 code and weights; the Places365 training images are for research use only (see the card)."

# --- tracking
tapir = "TAPIR and BootsTAPIR (Google DeepMind, 2023 / 2024): track any point through a whole video offline: a per-frame match from a cost volume, then four temporal refinement passes; BootsTAPIR adds self-training on real videos. Apache-2.0 code and weights."
alltracker = "AllTracker (Harley et al., ICCV 2025): track every pixel of a query frame through a whole video offline, as long-range optical flow over 16-frame windows; point queries read the dense result. MIT code and weights."
track_on = "Track-On2 and Track-On-R (Aydemir et al., 2025): online point tracking, one frame at a time, as a transformer decoder over a DINOv3 ViT-S+ adapter with a memory of past features; -R is fine-tuned on real videos. MIT; DINOv3 weights under the DINOv3 License."
locotrack = "LocoTrack (Cho et al., ECCV 2024): track any point through a whole video offline: a per-frame match from a cost volume, then refinement with local 4-D correlation and a transformer over the frames of each track. Apache-2.0 code and weights."
tapnext = "TAPNext (Google DeepMind, 2025): tracks any point through a video, online one frame at a time, as next-token prediction with a ViT + linear-recurrence (RG-LRU) backbone; BootsTAPNext-B and the long-video TAPNext++. Apache-2.0 code and weights."
megaloc = "MegaLoc (Politecnico di Torino, 2025): one descriptor per photo to find photos of the same place (place recognition, loop closure, image pairs for 3-D reconstruction); DINOv2 ViT-B with optimal-transport pooling. MIT code and weights; some training sets are research-only."
geocalib = "GeoCalib (ETH Zurich / Microsoft, 2024): the camera of one photo (focal length, field of view) and how it is tilted (roll, pitch from gravity), from perspective fields and an optimisation; no checkerboard needed. Apache-2.0 code, CC-BY-4.0 weights; training photos of mixed licences."
anycalib = "AnyCalib (University of Zaragoza, ICCV 2025): the camera of one photo (focal length, principal point, field of view) from one predicted viewing ray per pixel and a fit; no checkerboard needed, no gravity. Apache-2.0 code and weights; trained on crops of public 360-degree panoramas."
boq = "BoQ, Bag-of-Queries (Université Laval, 2024): one descriptor per photo to find photos of the same place (place recognition, loop closure); DINOv2 ViT-B with learned queries that read out the image features. MIT code and weights."
totalsegmentator = "TotalSegmentator (University Hospital Basel): nnU-Net v2 networks that label 117 anatomical structures (organs, bones, muscles, vessels) in CT volumes, at 1.5 mm (five networks) or 3 mm (one, faster). Commercially usable (Apache-2.0 code and weights)."
