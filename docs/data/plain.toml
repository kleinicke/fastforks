segformer = "NVIDIA's SegFormer: a transformer for ADE20K scene segmentation (sizes B0 and B5), plus two community fine-tunes: clothes parsing (B2, 18 classes) and face parsing (B5, 19 classes). Non-commercial weights."
bisenet = "BiSeNet face parsing (Yu et al., ECCV 2018; zllrunning's face-parsing.PyTorch checkpoint as shipped by facexlib): labels skin, brows, eyes, glasses, ears, nose, mouth, lips, neck, cloth, hair and hat in a face crop (19 classes, CelebAMask-HQ). MIT code and weights."

# --- promptable segmentation
efficientvit_sam = "EfficientViT-SAM (MIT Han lab): Segment Anything with a fast convolutional image encoder, in five sizes."
mobile_sam = "MobileSAM: Segment Anything with a small TinyViT image encoder distilled from the largest SAM."
sam = "Segment Anything: masks from clicks, boxes or mask prompts, in sizes B, L and H."
sam_hq = "HQ-SAM (ETH Zurich): Segment Anything with an added head for sharper mask borders and thin structures, in sizes B, L and H."
sam2 = "Segment Anything 2.1 in image mode: masks from clicks, boxes or mask prompts, in four sizes."
sam3 = "Segment Anything 3: masks for every object that matches a text or example prompt, as well as clicks and boxes. Meta's SAM License applies; commercially usable under it."
insid3 = "INSID3 (2026): finds the object shown in one or more example images with masks in a new image, without training, from Meta's DINOv3 features. Apache-2.0 code; the DINOv3 weights are under the gated DINOv3 licence."
clipseg = "CLIPSeg (Lüddecke and Ecker, CVPR 2022): one coarse mask for whatever a free-text prompt names, from a frozen CLIP ViT-B/16 and a small decoder. Apache-2.0 code and weights; the PhraseCut training data has no stated terms."

# --- detection
rcnn = "Faster R-CNN and Mask R-CNN from the detectron2 model zoo (ResNet-50 FPN, COCO): boxes, classes and, for Mask R-CNN, instance masks."
detr = "DETR (ResNet-50 and ResNet-101, COCO) from Facebook Research: end-to-end boxes and classes from 100 object queries, no NMS."
rtdetrv2 = "RT-DETRv2 (S, M, M*, L, X; ResNet-vd, COCO) from the RT-DETR authors: real-time end-to-end detector, 300 queries and deformable attention, no NMS."
rtmdet = "OpenMMLab's RTMDet (tiny, s, m, l, x on COCO; nano and m person detectors): real-time one-stage box detector, a CSPNeXt CNN with NMS. The person detectors supply the boxes for RTMPose. Apache-2.0."
yolox = "Megvii's YOLOX (tiny, s, m, l, x on COCO): anchor-free one-stage box detector, a CSPDarknet CNN with a decoupled head and NMS. Apache-2.0 code and weights."
dfine = "D-FINE (N, S, M, L, X; HGNetV2, COCO) from USTC: real-time end-to-end detector in the RT-DETR style, 300 queries, deformable attention and box edges refined as distributions, no NMS. Also DEIM (N, S, M, L, X): the same network with SiLU decoder MLPs, trained with dense one-to-one matching."
lwdetr = "LW-DETR (tiny to xlarge; ViT, COCO) from Baidu: real-time end-to-end detector, a plain ViT encoder with a multi-level projector and a DETR decoder with deformable attention, no NMS. Apache-2.0 code and weights."
rfdetr = "Roboflow RF-DETR (N, S, M, L detection; Seg N to 2XL with instance masks; COCO): real-time end-to-end detector with a windowed DINOv2 backbone and deformable decoder, no NMS. Apache-2.0 code and weights."
owlv2 = "Google's OWLv2 (CLIP ViT-B/16 and L/14): open-vocabulary detector, finds boxes for any class names given as text at call time (default: the 80 COCO classes). Apache-2.0 code and weights."
grounding_dino = "IDEA Research's Grounding DINO and OpenMMLab's MM-Grounding-DINO (tiny, base; Swin backbone, BERT text encoder): open-vocabulary detector, finds boxes for class names given as text at call time (default: the 80 COCO classes). Apache-2.0 code and weights."

