# Plain-language one-liners per model family for the generated model pages (tools/gen_docs.py).
# Facts only, each from the family's card.toml, its LICENSE or the page's own tables: what it is for, who made it
# (only where the card or the vendored LICENSE names them), the licence in plain words. No speed or ranking claims.
# "commercially usable" needs every variant of the family to be commercial yes, "non-commercial" at least one no
# (tests/test_docs.py).

# --- stereo
aanet = "A stereo network that aggregates matching costs with sparse deformable sampling across scales, trained on synthetic SceneFlow data."
bridgedepth = "A stereo network that aligns Depth Anything V2 features with NMRF-style disparity proposals. Non-commercial weights."
c_foundationstereo = "NVIDIA's releases of FoundationStereo for commercial use, including a distilled fast variant. The licence differs by variant, see the table."
cas_gwcnet = "Alibaba's cascade version of GwcNet: two cost-volume stages, the second narrowed around the first disparity. Trained on synthetic data."
cfnet = "A stereo network with cascaded and fused cost volumes, trained on synthetic data."
coex = "A stereo network on a MobileNetV2 backbone with guided cost excitation (correlate and excite)."
crestereo = "Megvii's cascaded recurrent stereo network, trained on a wide mix of real and synthetic stereo data."
defom_stereo = "A stereo network from the Insta360 Research Team that uses Depth Anything V2 features and an initial depth prior. Non-commercial weights."
dlnr = "A stereo network in the RAFT-Stereo style with a decoupled LSTM and normalization refinement."
fast_acvnet = "A stereo network by Gangwei Xu et al. that uses attention-selected disparities and a MobileNetV2 backbone, in a base and a plus version."
foundationstereo = "NVIDIA's zero-shot stereo foundation model. Non-commercial weights."
great_igev = "IGEV-Stereo extended with global attention (spatial, epipolar-row and volume attention)."
gwcnet = "A classic stereo network by Xiaoyang Guo et al. that builds a group-wise correlation cost volume."
hitnet = "Google Research's tile-based stereo model; the authors' ETH3D and Middlebury versions, ported to PyTorch."
igev_plusplus = "The successor of IGEV-Stereo by Gangwei Xu et al., with multi-range geometry encoding volumes for large disparity ranges."
igev_stereo = "An iterative stereo network by Gangwei Xu et al. (geometry encoding volume with ConvGRU updates), with several fine-tuned checkpoints."
las2 = "LiteAnyStereo V2, an efficient zero-shot stereo family in sizes S, M, L and H."
mocha_stereo = "A stereo network by Ziyang Chen et al. that adds motif channel attention to an IGEV-style volume."
monster = "A stereo network that combines Depth Anything V2 mono depth with stereo matching. Non-commercial licence."
monster_plusplus = "The accuracy model of MonSter++, which combines mono depth and stereo matching; Autel Robotics and Huazhong University of Science and Technology. Non-commercial licence."
nmrf = "A stereo network from the CUHK T-Stone Robotics Institute that treats matching as Markov random field inference."
psmnet = "A classic stereo network by Jia-Ren Chang with a spatial-pyramid backbone and stacked 3D hourglasses."
raft_stereo = "A recurrent stereo network from the Princeton Vision & Learning Lab, with checkpoints for several datasets."
rt_monster_plusplus = "The real-time version of MonSter++ (Autel Robotics and Huazhong University of Science and Technology), using a small mono depth model. Non-commercial licence."
s2m2 = "A transformer-based stereo family in four sizes (S, M, L, XL). Non-commercial licence."
selective_igev = "IGEV-Stereo with selective recurrent units, by Xianqi Wang et al., with checkpoints for several datasets."
waft_stereo = "A stereo network from the Princeton Vision & Learning Lab that warps features instead of building a cost volume, in sizes S and B. The licence differs by size, see the table."

# --- flow
raft = "RAFT (Teed and Deng, Princeton) with torchvision's weights: dense optical flow refined step by step over an all-pairs correlation volume. BSD-3-Clause code; some training sets (FlyingChairs, Sintel) are research-only."
sea_raft = "SEA-RAFT (Princeton, 2024): a faster and more accurate successor of RAFT for dense optical flow, needing only 4 refinement steps. BSD-3-Clause code and weights; some training sets are research-only."
recover = "ReCoVEr (TU Darmstadt, 2025): optical flow without a cost volume, so it is fast and light at high resolution; three sizes. BSD-3-Clause code and weights; some training sets are research-only."
megaflow = "MegaFlow (ETH Zurich, 2025): large-displacement optical flow on a frozen DINOv2 backbone with global matching and refinement; one large model. Apache-2.0 code and weights."
neuflow_v2 = "NeuFlow v2 (Northeastern University, 2024): a small and fast optical-flow network built for edge devices: a light CNN backbone, global matching at 1/16 and a few cheap refinements at 1/8. Apache-2.0 code and weights."
memfof = "MEMFOF (MSU Graphics & Media Lab, ICCV 2025): memory-efficient multi-frame optical flow, a RAFT-style network that also looks at the previous frame and runs at full HD. BSD-3-Clause code and weights; some training sets are research-only."
memflow = "MemFlow (Dong and Fu, CVPR 2024): optical flow with a motion memory, a RAFT-style network whose update step also reads attention over the frame's motion features. Apache-2.0 code and weights; some training sets are research-only."
gmflow = "GMFlow (2022; the flow models of UniMatch, 2023): optical flow as one global matching step between Transformer-enhanced features of both images; variants add a second matching scale and refinement steps. MIT code; the authors' weights carry no separate licence."
xfeat = "XFeat (Verlab, CVPR 2024): fast sparse keypoints and descriptors, matched by mutual nearest neighbours or LighterGlue; output as keypoints plus index pairs (the form COLMAP takes). Apache-2.0 code and weights."
lightglue = "LightGlue (ETH Zurich, Microsoft; ICCV 2023) with ALIKED or DISK keypoints: sparse matching of two photos of one scene, as keypoints plus index pairs (the form COLMAP takes). Apache-2.0 (LightGlue, DISK) and BSD-3-Clause (ALIKED) code and weights."
loftr = "LoFTR (Zhejiang University, CVPR 2021): detector-free matching of two photos of one scene with transformers; semi-dense matches as keypoint pairs (the form COLMAP takes). Outdoor (MegaDepth) and indoor (ScanNet) weights. Apache-2.0 code and weights."
dedode = "DeDoDe v2 (Chalmers, Linköping University; 3DV 2024): sparse keypoints from a detector network, descriptions from a separate one (VGG19, plus DINOv2 for -G), dual-softmax matches as keypoint index pairs (the form COLMAP takes). MIT; DINOv2 Apache-2.0."
loma = "LoMa (Nordström, Edstedt et al. 2026): sparse matching of two photos of one scene: DaD keypoints, DeDoDe-G descriptions (VGG19 plus DINOv2) and a light LightGlue-style transformer matcher; matches as keypoint index pairs (the form COLMAP takes). MIT code and weights; DINOv2 Apache-2.0."
flexglue = "FlexGlue (ETH Zurich and partners, 2026): sparse matching of two photos of one scene: ALIKED keypoints, DINOv3 ConvNeXt features and a transformer that predicts where each keypoint lands in the other photo; keypoint index pairs. MIT; DINOv3 backbone weights under the DINOv3 licence."
romav1 = "RoMa (2024): dense matching between two photos of one scene from any viewpoints: where each pixel of the first image is in the second, and how sure the model is that it is visible there. Built on Meta's DINOv2 and a VGG19. MIT code and weights; the DINOv2 weights are Apache-2.0."
romav2 = "RoMa v2 (2025): dense matching between two photos of one scene from any viewpoints: where each pixel of the first image is in the second, and how sure the model is that it is visible there. Built on Meta's DINOv3. MIT code; the DINOv3 parts of the code and weights are under the DINOv3 licence."
birefnet = "BiRefNet (Nankai University and partners, CAAI AIR 2024): cuts the foreground out of a photo as a soft mask at full resolution (background removal), with a Swin Transformer encoder; general and lite versions (MIT code and weights) and BRIA's RMBG-2.0 weights (non-commercial, gated download)."
vitmatte = "ViTMatte (Huazhong University of Science and Technology, 2023): refines a rough trimap (sure background, sure foreground, unknown band) into a soft alpha matte, e.g. hair and fur edges; a plain Vision Transformer plus a small detail decoder; small and base versions. Apache-2.0 code and weights."
ben2 = "BEN2 (Prama LLC, 2025): cuts the foreground out of a photo as a soft mask (background removal); a Swin Transformer looks at the whole image and at four full-resolution patches and merges the views. MIT code and weights."
lineart = "Informative-drawings line art (MIT CSAIL, CVPR 2022), as packaged for ControlNet: draws the lines of a photo as a sketch-like map, the input of the line-art ControlNet; a fine and a coarse version. MIT code and weights."
lineart_anime = "Anime line art (a pix2pix U-Net, as packaged for ControlNet by lllyasviel): draws the clean outlines of an anime or cartoon image as a line map, the input of the anime line-art ControlNet. MIT code and weights."
hed = "HED edges (Xie and Tu, ICCV 2015; ControlNet's Apache-2.0 re-implementation): soft, thick edge maps of a photo at several scales, the input of the soft-edge ControlNet. Apache-2.0 code and weights."
u2net = "U²-Net (University of Alberta, Pattern Recognition 2020): finds the main object of a photo and cuts it out as a soft mask at 320 x 320 (rembg's default background remover); a full model, a 4.7 MB small one and one trained on people. Apache-2.0 code and weights."
isnet = "IS-Net (ECCV 2022, the DIS benchmark's authors): cuts the foreground out of a photo as a fine mask at 1024 x 1024 (background removal); the authors' general-use model and the academic DIS5K one. Apache-2.0 code and weights."
inspyrenet = "InSPyReNet (Kim et al., ACCV 2022) as transparent-background ships it: cuts the foreground out of a photo as a soft mask at 1024 x 1024 (384 x 384 fast); a Swin-B encoder with an image-pyramid decoder. MIT code and weights."
flowseek = "FlowSeek (University of Bologna, 2025), size T: SEA-RAFT optical flow that also uses a frozen Depth Anything V2 Small: its features help the matching and its depth tells which flow a camera motion would cause. Apache-2.0 code; the authors' weights carry no separate licence."

flowformer = "FlowFormer Small (ECCV 2022): convolutional features and a latent cost-memory transformer for optical flow. Apache-2.0 code; the authors provide no separate checkpoint licence."

# --- depth
depth_anything_3 = "ByteDance's Depth Anything 3: depth from one image, with relative, metric and multi-view versions. The licence differs by variant, see the table."
depth_anything_v2 = "Depth Anything V2: relative depth from one image, in small, base and large. The licence differs by size, see the table."
video_depth_anything = "Video Depth Anything (ByteDance): depth of a whole video, consistent from frame to frame, in windows of 32 frames on the Depth Anything V2 Small encoder; relative and metric. Apache-2.0 code and weights (Small only)."
prompt_depth_anything = "Prompt Depth Anything: metric depth from one image plus a low-resolution depth prompt (for example a phone LiDAR map), in small and large."
omni_dc = "OMNI-DC: metric depth completion for any sparse pattern; it predicts depth gradients at three scales and integrates them with the sparse points, helped by Depth Anything V2 Large. BSD-3 code, weights non-commercial (they include Depth Anything V2 Large)."
any2full = "Any2Full: metric depth completion that prompts Depth Anything V2 with a sparse depth map of any pattern and density, in small, base and large. Apache-2.0 code and weights."
lingbot_depth = "LingBot-Depth (Robbyant, 2026): metric depth completion from an image plus an incomplete or noisy metric depth map (RGB-D camera, LiDAR), and a depth-completion variant (dc). Apache-2.0 code and weights."
depth_pro = "Apple's single-image model for metric depth and the camera focal length, at 1536x1536 internal resolution. Research-only licence."
lotus = "Lotus from HKUST (Guangzhou): surface normals from one image in one step on a Stable Diffusion UNet, generative (G) or direct (D). Apache-2.0 code and weights."
marigold = "Marigold from ETH Zurich (PRS): depth from one image by diffusion on a Stable Diffusion UNet. Commercially usable under an OpenRAIL licence."
depthfm = "DepthFM (CompVis, LMU Munich): relative depth from one image by flow matching on a Stable Diffusion UNet, in two steps. MIT code; OpenRAIL weights (commercially usable with use restrictions)."
marigold_normals = "Marigold normals LCM from ETH Zurich (PRS): surface normals from one image in one diffusion step on a Stable Diffusion UNet. Apache-2.0 code and weights."
metric3d = "Metric3D v2 (Wei Yin and Mu Hu et al.): metric depth and surface normals from one image, given the focal length. Commercially usable; the authors ask commercial users to contact them."
midas = "MiDaS v3.1 from Intel ISL, with a BEiT-L encoder: relative depth from one image."
moge = "Microsoft's MoGe: depth, 3D points, normals and focal length from one image."
stablenormal = "StableNormal turbo from Stable-X (Ye et al., SIGGRAPH Asia 2024): surface normals from one image in one step on a Stable Diffusion UNet with a ControlNet image encoder. Apache-2.0 code and weights."
unidepth_v2 = "UniDepth V2: metric depth from one image without known camera data. Non-commercial licence."
unik3d = "UniK3D: metric 3D from one image for any camera type, using a spherical-harmonic ray model. Non-commercial licence."
zoedepth = "ZoeDepth from the Intelligent Systems Lab: metric depth from one image, for indoor and outdoor scenes."

