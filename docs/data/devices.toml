# Measured devices (docs/data/README.md, "Devices"). One table per device; the key is the slug of its page
# docs/devices/<slug>.md and its data file. Exactly one device is the reference (`reference = true`): its rows are
# docs/data/speed.jsonl (the speed floor), its tables are docs/benchmarks.md. Every other device is a survey: rows in
# docs/data/speed/<slug>.jsonl, no regression floor.
#
# Slug: vendor + model + memory size (`rtx-5060-ti-16gb`, `rx-7900-xtx-24gb`, `apple-m1-pro-16gb`); core counts and
# the backend go in the fields, not the slug. Order = the column order of the cross-device table.
#
#   name      the device as the docs name it
#   backend   cuda (NVIDIA), rocm (AMD, torch.cuda over HIP) or mps (Apple silicon)
#   match     the `gpu` value the measuring tools record for it (torch.cuda.get_device_name(); MPS: the chip name)
#   memory    memory as sold (unified on Apple silicon)
#   details   further hardware facts (cores, power limit, host)
#   software  OS / driver / torch / toolkit of the shown measurements

[rtx-5060-ti-16gb]
name = "RTX 5060 Ti 16 GB"
reference = true
backend = "cuda"
match = "NVIDIA GeForce RTX 5060 Ti"
memory = "16 GB GDDR7"
details = "Blackwell, sm_120"
software = "Linux, torch 2.14.1+cu130, CUDA 12.8 kernels (13.0 for four stereo families), cuDNN 9.24"

[apple-m1-pro-16gb]
name = "Apple M1 Pro 16 GB"
backend = "mps"
match = "Apple M1 Pro"
memory = "16 GB unified"
details = "16-core GPU"
software = "macOS 27, torch 2.14"
