site_name: fastforks
repo_url: https://github.com/kleinicke/fastforks
theme:
  name: material
  features: [content.code.copy, navigation.sections]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            inherited_members: true
nav:
  - Home: index.md
  - Usage: usage.md
  - Docker and offline: docker.md
  - Export: export.md
  - Stereo geometry: stereo_geometry.md
  - Which model: overview.md
  - Benchmarks:
      - Methods and RTX 5060 Ti (reference): benchmarks.md
      - Apple M1 Pro: devices/apple-m1-pro-16gb.md
      - NVIDIA A10: devices/a10-22gb.md
      - NVIDIA A100 40 GB: devices/a100-sxm4-40gb.md
      - NVIDIA L4: devices/l4-22gb.md
      - NVIDIA L40S: devices/l40s-44gb.md
      - NVIDIA RTX PRO 6000: devices/rtx-pro-6000-96gb.md
  - Other GPUs: OTHER_GPUS.md
  - API:
      - fastforks: api/index.md
      - Stereo: api/stereo.md
      - Stereo geometry: api/geometry.md
      - Optical flow: api/flow.md
      - Dense matching: api/matching.md
      - Depth: api/depth.md
      - Classification: api/classification.md
      - Segmentation: api/segmentation.md
      - Features: api/features.md
      - Pose: api/pose.md
      - Promptable segmentation: api/promptable_segmentation.md
      - Detection: api/detection.md
      - Multi-view: api/multiview.md
      - Matting: api/matting.md
      - Errors: api/errors.md
  - Models:
      - Stereo: models/stereo.md
      - Optical flow: models/flow.md
      - Dense matching: models/matching.md
      - Depth: models/depth.md
      - Classification: models/classification.md
      - Segmentation: models/segmentation.md
      - Features: models/features.md
      - Pose: models/pose.md
      - Promptable segmentation: models/promptable_segmentation.md
      - Detection: models/detection.md
      - Multi-view: models/multiview.md
      - Matting: models/matting.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true
