# Hugging Face weights repos `fastforks/<name>`, ONLY for weights we changed (converted / quantized); user, 2026-11-15:
# unchanged upstream weights are not mirrored (the cards point at the authors' hosts). A repo needs: the weights'
# own licence checked (permissive, ungated), name = upstream stem + dtype tag (`-bf16`, `-nf4`), and a README that states
# the source, the precision and the conversion script. `tools/stage_hf.py weights OUT` stages each repo from this
# table and the cards. Licence checks are kept in the maintainers' archive.
#
# Keys: title, by (authors), upstream (repo + revision the weights come from), licence (SPDX) + licence_url +
# licence_evidence (the upstream sentence that licenses the WEIGHTS), files (name -> sha256), licence_files
# (published name -> path below src/fastforks), converted (what we changed), notice (text of a NOTICE file stating
# our changes, for converted Apache-2.0 weights), precision + script (the dtype of the stored tensors and the repo's
# conversion script, which is copied into the weights repo).
# marigold-v2-depth-nf4 is hand-staged (not in this table).

